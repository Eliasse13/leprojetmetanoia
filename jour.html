<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Metanoia — Le brief du matin</title>
<meta name="description" content="Le programme du jour du projet Metanoia.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://mfbrnmhtoqqklmywclxt.supabase.co" crossorigin>
<link rel="preload" href="/polices/chivo-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/polices/chivo-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/polices.css?v=1">
<style>
:root{--vert:#0B7A3E;--vif:#12B85F;--alim:#C9A227;--som:#4C6FA5;--lec:#8258DD;--arg:#2E8B8B;
  --mus:#C0504F;--cul:#3F7C9C;--tra:#5C5470;
  --ink:#0D0F0E;--piste:#E8EBE9;--sourd:#6B736E;--texte:#454B48;--rouge:#C4452F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:var(--ink);font-family:Chivo,system-ui,sans-serif;max-width:430px;margin:0 auto;
  min-height:100svh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

.hd{display:flex;align-items:center;padding:max(14px,env(safe-area-inset-top)) 20px 11px}
.hd .lg{width:74px;color:var(--ink);line-height:0}
.hd .lg svg{display:block;width:100%;height:auto}
.hd .menu{margin-left:auto;background:none;border:0;cursor:pointer;display:grid;gap:4px;padding:9px;margin-right:-9px}
.hd .menu i{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px}

.z{flex:1;display:flex;flex-direction:column;justify-content:space-between;
  padding:26px 22px max(22px,env(safe-area-inset-bottom));gap:22px}
.k{font-weight:300;font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:#A9B0AC}
.gros{font-weight:900;font-size:clamp(28px,8.6vw,36px);letter-spacing:-.045em;line-height:1.04;margin-top:14px}
.gros em{font-style:normal;color:var(--vert)}
.det{font-weight:300;font-size:13.5px;color:var(--texte);line-height:1.65;margin-top:14px}
.det b{font-weight:900;color:var(--ink)}

.lignes{border-top:1px solid var(--piste);margin-top:22px}
.lignes .l{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:10px 0;border-bottom:1px solid #F4F6F5;font-weight:300;font-size:11.5px;color:var(--sourd)}
.lignes .l b{font-weight:900;color:var(--ink);text-align:right}

.go{display:block;background:var(--ink);color:#fff;border-radius:999px;padding:15px;text-align:center;
  font-weight:900;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  transition:filter .2s}
.go:hover{filter:brightness(1.35)}
.go:focus-visible{outline:3px solid var(--vert);outline-offset:3px}

/* la journée, dépliée sous le brief */
.journee{margin-top:4px}
.journee .t{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.journee .t b{font-weight:900;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.journee .t em{font-style:normal;font-weight:900;font-size:11px;color:var(--sourd)}
.journee .l{display:flex;align-items:center;gap:11px;padding:11px 0 11px 12px;border-left:3px solid;
  border-bottom:1px solid #F4F6F5;cursor:pointer}
.journee .l .c b{display:block;font-weight:900;font-size:13.5px;letter-spacing:-.015em;line-height:1.2}
.journee .l .c span{display:block;font-weight:300;font-size:10.5px;color:var(--sourd);margin-top:2px;line-height:1.4}
.journee .l .cb{margin-left:auto;width:22px;height:22px;border-radius:7px;border:2px solid #DDE3E0;flex:none;
  position:relative;transition:background .18s,border-color .18s}
.journee .l.ok .cb{background:var(--vif);border-color:var(--vif)}
.journee .l.ok .cb::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:900}
.journee .l.ok .c b{color:#C0C7C3;text-decoration:line-through}
.journee .l.ok .c span{color:#D3D9D6}
.replier{width:100%;background:none;border:0;font-family:inherit;cursor:pointer;
  font-weight:300;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#B7BEBA;padding:14px 0 4px}

.fini{background:#F3FAF6;border-radius:14px;padding:15px;margin-top:14px;text-align:center}
.fini b{display:block;font-weight:900;font-size:14px;color:var(--vert)}
.fini span{display:block;font-weight:300;font-size:11.5px;color:var(--texte);margin-top:4px;line-height:1.5}
.err{font-weight:700;font-size:11.5px;color:var(--rouge);text-align:center;min-height:1.2em}
.cache{display:none}
</style>
</head>
<body>
<header class="hd">
  <a class="lg" href="metanoia.html" aria-label="Vue d'ensemble"><svg viewBox="0 0 5.0710 0.6860" aria-hidden="true"><g fill="currentColor"><path transform="translate(-0.05700 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H401L500 320H504L601 686H947V0H737V440H733L613 0H372L253 440H248V0Z"/><path transform="translate(0.86300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H572L552 526H263V426H541V273H263V160H552L572 0Z"/><path transform="translate(1.45000 0.68600) scale(0.001000 -0.001000)" d="M187 0V521H15V686H571V521H398V0Z"/><path transform="translate(1.90600 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/><path transform="translate(2.59300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H233L410 431L441 372L446 375V686H639V0H459L276 264L255 306L250 304V0Z"/><path transform="translate(3.23100 0.68600) scale(0.001000 -0.001000)" d="M331 -10Q269 -10 214.5 13.5Q160 37 119.0 78.0Q78 119 54.5 173.5Q31 228 31 290V394Q31 456 54.5 510.5Q78 565 119.0 606.0Q160 647 214.5 670.5Q269 694 331 694H387Q449 694 503.5 670.5Q558 647 599.0 606.0Q640 565 663.5 510.5Q687 456 687 394V290Q687 228 663.5 173.5Q640 119 599.0 78.0Q558 37 503.5 13.5Q449 -10 387 -10ZM359 146Q382 146 400.5 154.0Q419 162 433.0 175.5Q447 189 454.5 207.0Q462 225 462 246V438Q462 459 454.5 477.0Q447 495 433.0 509.0Q419 523 400.5 530.5Q382 538 359 538Q337 538 318.0 530.0Q299 522 285.0 508.5Q271 495 263.5 477.0Q256 459 256 438V246Q256 225 263.5 207.0Q271 189 285.0 175.0Q299 161 318.0 153.5Q337 146 359 146Z"/><path transform="translate(3.91200 0.68600) scale(0.001000 -0.001000)" d="M36 0V148H118V538H36V686H410V538H329V148H410V0Z"/><path transform="translate(4.35700 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/></g></svg></a>
  <button class="menu" id="ouvrirMenu" aria-label="Ouvrir le menu"><i></i><i></i></button>
</header>

<div class="z" id="z"><p class="k">Chargement…</p></div>

<script type="module">
import { list, litRegles, litGouts, listTaches, bascule, projetActif, listJournal }
  from './config.js?v=20260903b';
import { vdot, recommandation, fmtAllure } from './moteur.js?v=20260903b';
import { genererSemaine } from './cuisine.js?v=20260903b';

const $ = id => document.getElementById(id);
const z = $('z');
const auj = new Date();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const AUJ = iso(auj);
const COUL = { sport:'var(--sport)', alim:'var(--alimF)', sommeil:'var(--som)', lecture:'var(--lec)', argent:'var(--arg)' };

function heure(t) { return (t || '').slice(0,5).replace(':', ' h '); }

try {
  const [seances, regles, gouts, faites, projet, journal] = await Promise.all([
    list().catch(() => []), litRegles(), litGouts(),
    listTaches(AUJ).catch(() => []), projetActif().catch(() => null),
    listJournal().catch(() => [])
  ]);

  const v = projet ? vdot(projet.ref_distance_m, projet.ref_chrono_s) : 50;
  const r = recommandation(seances, v, auj, journal);

  // les repas du jour, dans la même trame que la page Alimentation
  const TRAME = [
    { seance:'Repos', intensite:'repos' }, { seance:'Endurance', intensite:'souple' },
    { seance:'Seuil', intensite:'dure' },  { seance:'Renfo', intensite:'souple' },
    { seance:'Endurance', intensite:'souple' }, { seance:'Sortie longue', intensite:'dure' },
    { seance:'Repos', intensite:'repos' }
  ];
  const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const idx = (auj.getDay() + 6) % 7;
  let repas = null;
  if (gouts) {
    const sem = genererSemaine(gouts, JOURS.map((nom, k) => ({ nom, ...TRAME[k] })));
    repas = sem[idx];
  }

  // construction des tâches
  const T = [];
  if (repas?.matin) T.push(['petitdej','alim','Petit-déjeuner', repas.matin.nom]);
  if (regles?.euros_jour) T.push(['argent','argent',
    `Mettre ${Number(regles.euros_jour).toFixed(0)} € de côté`,
    regles.objectif_argent || `${(Number(regles.euros_jour)*30).toFixed(0)} € par mois`]);
  if (repas?.midi) T.push(['dejeuner','alim','Déjeuner', repas.midi.nom]);

  if (r.titre.toLowerCase().includes('repos')) {
    T.push(['sport','sport','Repos', r.pourquoi.split('.')[0] + '.']);
  } else {
    const blocs = (r.blocs || []).map(b => `${b.nom} ${b.detail ? '(' + b.detail + ')' : ''} à ${fmtAllure(b.secondesParKm)}`);
    T.push(['sport','sport', r.titre, blocs.length ? blocs.join(' · ') : `environ ${r.km} km`]);
  }

  if (repas?.soir) T.push(['diner','alim','Dîner', repas.soir.nom]);
  if (regles?.pages_jour) T.push(['lecture','lecture',
    `Lire ${regles.pages_jour} pages`,
    regles.livre ? `${regles.livre}${regles.page_actuelle ? ' — page ' + regles.page_actuelle : ''}` : 'Livre en cours']);
  if (regles?.coucher) T.push(['sommeil','sommeil',
    `Extinction ${heure(regles.coucher)}`,
    `Lever ${heure(regles.lever)} — ${heuresDeSommeil(regles)} de sommeil`]);

  function heuresDeSommeil(rg) {
    const [hc, mc] = rg.coucher.split(':').map(Number);
    const [hl, ml] = rg.lever.split(':').map(Number);
    let m = (hl*60 + ml) - (hc*60 + mc); if (m <= 0) m += 1440;
    return `${Math.floor(m/60)} h${m%60 ? ' ' + String(m%60).padStart(2,'0') : ''}`;
  }

  const etat = Object.fromEntries(faites.map(f => [f.cle, f.fait]));
  const rendu = () => {
    const n = T.filter(t => etat[t[0]]).length;
    $('compte').textContent = `${n} / ${T.length}`;
    $('compte2').textContent = `${n} sur ${T.length}`;
    $('fini').style.display = n === T.length ? 'block' : 'none';
  };

  const forme = r.forme || { score: null };
  const km7 = (seances || []).filter(s => (auj - new Date(s.date + 'T00:00:00')) / 864e5 <= 7)
                             .reduce((t, x) => t + Number(x.distance_km || 0), 0);
  const jourNum = Math.max(1, Math.floor((auj - new Date('2026-08-28T00:00:00')) / 864e5) + 1);

  // la phrase du brief découle de la séance du jour
  const sport = T.find(t => t[1] === 'sport');
  const repos = /repos/i.test(r.titre);
  const phrase = repos
    ? `Aujourd’hui,<br><em>tu ne cours pas.</em>`
    : `Aujourd’hui,<br><em>${r.titre.toLowerCase()}.</em>`;
  const explication = repos
    ? r.pourquoi
    : (r.blocs || []).length
      ? `${(r.blocs || []).map(b => `${b.nom.toLowerCase()} ${b.detail ? '(' + b.detail + ')' : ''} à <b>${fmtAllure(b.secondesParKm)}</b>`).join(', ')}. ${r.pourquoi.split('.')[0]}.`
      : r.pourquoi;

  z.innerHTML = `
    <div>
      <p class="k">Le brief du matin — jour ${jourNum}</p>
      <p class="gros">${phrase}</p>
      <p class="det">${explication}</p>

      <div class="lignes">
        ${forme.score !== null ? `<div class="l"><span>Fraîcheur</span><b>${forme.score} %</b></div>` : ''}
        <div class="l"><span>Cette semaine</span><b>${km7.toFixed(1).replace('.', ',')} km</b></div>
        ${repas?.midi ? `<div class="l"><span>Au frigo ce midi</span><b>${repas.midi.nom}</b></div>` : ''}
        ${regles?.coucher ? `<div class="l"><span>Extinction</span><b>${heure(regles.coucher)}</b></div>` : ''}
        <div class="l"><span>Tâches du jour</span><b id="compte">0 / ${T.length}</b></div>
      </div>

      <div class="journee cache" id="journee">
        <div class="t"><b>La journée</b><em id="compte2"></em></div>
        ${T.map(([cle, pil, titre, detail]) => `
          <div class="l" data-cle="${cle}" data-pil="${pil}" style="border-left-color:${COUL[pil]}">
            <div class="c"><b>${titre}</b><span>${detail || ''}</span></div>
            <span class="cb"></span></div>`).join('')}
        <div class="fini" id="fini" style="display:none">
          <b>Journée complète.</b>
          <span>Les huit piliers sont cochés. Celles-là sont rares, et ce sont elles qui construisent la décennie.</span>
        </div>
        <button class="replier" id="replier">Replier</button>
      </div>
      <p class="err" id="err"></p>
    </div>

    <button class="go" id="voir">Voir la journée</button>`;


  rendu();

  // le brief se déplie sur la journée complète
  const j = $('journee'), bouton = $('voir');
  bouton.addEventListener('click', () => {
    j.classList.remove('cache');
    bouton.style.display = 'none';
    j.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  $('replier').addEventListener('click', () => {
    j.classList.add('cache'); bouton.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.querySelectorAll('.journee .l').forEach(el => el.addEventListener('click', async () => {
    const cle = el.dataset.cle, pil = el.dataset.pil;
    const t = T.find(x => x[0] === cle);
    const nouveau = !etat[cle];
    etat[cle] = nouveau;
    el.classList.toggle('ok', nouveau);
    rendu();
    try { await bascule(AUJ, cle, pil, t[2], t[3], nouveau); }
    catch (e) {
      etat[cle] = !nouveau; el.classList.toggle('ok', !nouveau); rendu();
      $('err').textContent = 'Non enregistré : ' + (e.message.includes('row-level')
        ? 'connecte-toi pour cocher.' : e.message);
    }
  }));

} catch (e) {
  z.innerHTML = '<p class="k" style="color:#C4452F">Erreur : ' + e.message + '</p>';
}
</script>

<script>
['copy','cut','contextmenu','dragstart','selectstart'].forEach(ev =>
  document.addEventListener(ev, e => { if (!e.target.closest('input,textarea')) e.preventDefault(); }));
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
</script>
</body>
