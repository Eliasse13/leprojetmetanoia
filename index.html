<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Metanoia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:#fff;color:#111;display:grid;place-items:center;text-align:center;font-family:'Cinzel',serif;user-select:none;-webkit-user-select:none}
h1{font-weight:400;font-size:clamp(2.2rem,8vw,6rem);letter-spacing:.3em;text-indent:.3em;opacity:0;animation:in 1.6s cubic-bezier(.16,1,.3,1) .2s forwards}
.btn{display:inline-block;margin-top:6vh;padding:1em 2.6em;border:1px solid #111;color:#111;text-decoration:none;font-size:clamp(.7rem,1.2vw,.85rem);letter-spacing:.4em;text-indent:.4em;position:relative;overflow:hidden;
  opacity:0;animation:in 1.6s cubic-bezier(.16,1,.3,1) 1s forwards;transition:color .5s cubic-bezier(.16,1,.3,1)}
.btn::before{content:"";position:absolute;inset:0;background:#111;transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.16,1,.3,1);z-index:-1}
.btn:hover,.btn:focus-visible{color:#fff;outline:none}
.btn:hover::before,.btn:focus-visible::before{transform:scaleX(1);transform-origin:left}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){h1{animation:none;opacity:1}}
</style>
</head>
<body>
<div>
  <h1>Metanoia</h1>
</div>
<script>
['wheel','touchmove','gesturestart','gesturechange'].forEach(e=>addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault();});
</script>
</body>
</html>
