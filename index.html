<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Metanoia — en travaux</title>
<meta name="description" content="Le projet Metanoia est en travaux. Il revient bientôt.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E8B93A">
<link rel="preconnect" href="https://mfbrnmhtoqqklmywclxt.supabase.co" crossorigin>
<link rel="preload" href="/polices/chivo-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/polices/chivo-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/polices.css?v=1">
<style>
:root{--jaune:#E8B93A;--ink:#16150F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--jaune);color:var(--ink);font-family:Chivo,system-ui,sans-serif;
  min-height:100svh;position:relative;overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}

.hachures{position:absolute;left:0;right:0;height:clamp(22px,5vw,30px);z-index:2;
  background:repeating-linear-gradient(45deg,var(--ink) 0 14px,var(--jaune) 14px 28px);
  background-size:39.6px 39.6px;animation:defile 2.4s linear infinite}
.hachures.h{top:0}
.hachures.b{bottom:0;animation-direction:reverse}
@keyframes defile{to{background-position:39.6px 0}}

.in{position:absolute;inset:clamp(22px,5vw,30px) 0;padding:clamp(28px,7vw,44px) clamp(24px,7vw,34px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:clamp(14px,3.4vh,22px)}
.ic{font-size:clamp(38px,11vw,52px);line-height:1;
  animation:balance 3.4s ease-in-out infinite}
@keyframes balance{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

h1{font-weight:900;font-size:clamp(27px,8.4vw,36px);letter-spacing:-.04em;line-height:1.05}
.txt{font-weight:300;font-size:clamp(12px,3.4vw,14px);line-height:1.65;
  color:rgba(22,21,15,.75);max-width:250px}

.enc{border:2px solid var(--ink);padding:clamp(13px,3.4vw,18px) clamp(18px,5vw,26px);margin-top:6px}
.enc b{display:block;font-weight:900;font-size:clamp(30px,9.4vw,40px);letter-spacing:-.04em;line-height:1}
.enc span{display:block;font-weight:900;font-size:clamp(8px,2.2vw,9px);letter-spacing:.28em;
  margin-top:6px;color:rgba(22,21,15,.7)}

.pied{position:absolute;left:0;right:0;bottom:clamp(34px,8vw,46px);text-align:center;z-index:3;
  font-weight:900;font-size:8.5px;letter-spacing:.26em;color:rgba(22,21,15,.45)}

@media (prefers-reduced-motion:reduce){.hachures,.ic{animation:none}}
</style>
</head>
<body>
<span class="hachures h"></span>

<div class="in">
  <p class="ic">🚧</p>
  <h1>Le site est<br>en travaux.</h1>
  <p class="txt">On refait l’intérieur. Le compteur, lui, continue de tourner.</p>
  <div class="enc">
    <b id="km">—</b>
    <span>DEPUIS LE 28.08.2026</span>
  </div>
</div>

<p class="pied">LEPROJETMETANOIA.FR</p>
<span class="hachures b"></span>

<script type="module">
import { list, fr, DEBUT } from './config.js?v=20260904b';
(async () => {
  try {
    const s = await list();
    const km = s.filter(x => x.date >= DEBUT).reduce((t, x) => t + Number(x.distance_km || 0), 0);
    document.getElementById('km').textContent = fr(km, 1) + ' km';
  } catch (e) {
    document.getElementById('km').textContent = '—';
  }
})();
</script>
<script>
['copy','cut','contextmenu','dragstart','selectstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));
</script>
</body>
</html>
