<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Metanoia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:linear-gradient(#fff,#e9f2ff);color:#111;display:grid;place-items:center;font-family:'Cinzel',serif;user-select:none;-webkit-user-select:none;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
h1{position:relative;z-index:2;font-weight:400;font-size:clamp(2.2rem,8vw,6rem);letter-spacing:.3em;text-indent:.3em;display:flex;white-space:nowrap}
h1 span{display:inline-block;opacity:0;animation:in 1.6s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(abs(var(--i) - 3.5)*.08s + .2s)}
@keyframes in{from{opacity:0;transform:translateX(calc((var(--i) - 3.5)*.6em))}to{opacity:1;transform:none}}
.load{position:relative;z-index:2;width:min(220px,40vw);height:1px;background:rgba(17,17,17,.15);margin-top:6vh;overflow:hidden;
  opacity:0;animation:fadein .8s ease 1.3s forwards}
.load i{position:absolute;left:0;top:0;height:100%;width:0;background:#111;animation:fill 1.6s cubic-bezier(.4,0,.2,1) 1.3s forwards}
@keyframes fadein{to{opacity:1}}
@keyframes fill{to{width:100%}}
@media(prefers-reduced-motion:reduce){h1 span,.load i{animation:none;opacity:1}.load i{width:100%}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div style="display:flex;flex-direction:column;align-items:center">
<h1 aria-label="Metanoia"><span style="--i:0">M</span><span style="--i:1">e</span><span style="--i:2">t</span><span style="--i:3">a</span><span style="--i:4">n</span><span style="--i:5">o</span><span style="--i:6">i</span><span style="--i:7">a</span></h1>
<div class="load"><i></i></div>
</div>
<script>
(()=>{
  const c=document.getElementById('c'),x=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;
  function rs(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;}
  rs();addEventListener('resize',rs);
  function draw(t){
    x.clearRect(0,0,W,H);
    for(let k=0;k<5;k++){
      x.beginPath();const y0=H*(.55+k*.08);
      for(let i=0;i<=W;i+=8*dpr){x.lineTo(i,y0+Math.sin(i/(220*dpr)+t/1400+k)*22*dpr+Math.sin(i/(90*dpr)-t/900)*8*dpr);}
      x.lineTo(W,H);x.lineTo(0,H);x.closePath();
      x.fillStyle=`rgba(90,140,220,${.05+k*.04})`;x.fill();
    }
    if(!reduce)requestAnimationFrame(draw);
  }
  draw(0);
  addEventListener('visibilitychange',()=>{if(!document.hidden&&!reduce)requestAnimationFrame(draw);});
})();
setTimeout(()=>location.href='metanoia.html',2000);
['wheel','touchmove','gesturestart','gesturechange'].forEach(e=>addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault();});
</script>
</body>
</html>
