<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Metanoia — maintenance</title>
<meta name="description" content="Le projet Metanoia est en maintenance. Il revient bientôt.">
<meta name="robots" content="noindex">

<style>
:root{--vif:#12B85F;--neon:#31E07A;--vert:#0B7A3E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05100A;color:#EDF2EF;font-family:Chivo,system-ui,sans-serif;
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(24px,6vw,40px);overflow:hidden;position:relative;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}

/* les masses vertes qui dérivent, comme le menu */
.blob{position:absolute;border-radius:50%;filter:blur(52px);opacity:.5;pointer-events:none}
.b1{width:62vw;height:62vw;max-width:340px;max-height:340px;background:#12B85F;left:-16vw;top:-6vh;
  animation:fl1 11s ease-in-out infinite alternate}
.b2{width:56vw;height:56vw;max-width:300px;max-height:300px;background:#0B7A3E;right:-18vw;top:34vh;
  animation:fl2 13s ease-in-out infinite alternate}
.b3{width:48vw;height:48vw;max-width:260px;max-height:260px;background:#31E07A;left:14vw;bottom:-14vh;
  opacity:.28;animation:fl1 16s ease-in-out infinite alternate-reverse}
@keyframes fl1{to{transform:translate(8vw,6vh) scale(1.14)}}
@keyframes fl2{to{transform:translate(-9vw,-5vh) scale(1.1)}}

.contenu{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,3vh,22px);width:100%;max-width:420px}
.lg{width:clamp(150px,52vw,230px);color:#fff;line-height:0}
.lg svg{display:block;width:100%;height:auto}

.n{font-weight:900;font-size:clamp(58px,17vw,86px);letter-spacing:-.055em;line-height:.9;
  opacity:0;animation:apparait .7s ease .25s forwards}
.n u{text-decoration:none;font-size:.24em;color:var(--neon);margin-left:4px}
.unite{font-weight:900;font-size:clamp(9px,2.5vw,11px);letter-spacing:.3em;text-indent:.3em;
  background:linear-gradient(180deg,#31E07A,#0B7A3E);-webkit-background-clip:text;background-clip:text;
  color:transparent;opacity:0;animation:apparait .7s ease .35s forwards}
.depuis{font-weight:300;font-size:clamp(8.5px,2.2vw,9.5px);letter-spacing:.2em;text-transform:uppercase;
  color:#5C6560;opacity:0;animation:apparait .7s ease .45s forwards}

.trait{width:44px;height:1px;background:#1E2422;margin:clamp(6px,1.6vh,12px) 0}

.mnt{font-weight:900;font-size:clamp(15px,4.2vw,19px);letter-spacing:-.02em;
  opacity:0;animation:apparait .7s ease .6s forwards}
.mnt .pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--neon);
  margin-right:9px;vertical-align:2px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
.sous{font-weight:300;font-size:clamp(11.5px,3vw,13px);color:#7F8883;line-height:1.6;max-width:280px;
  opacity:0;animation:apparait .7s ease .7s forwards}

@keyframes apparait{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.pied{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;z-index:2;
  font-weight:300;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#3D4441}

@media (prefers-reduced-motion:reduce){
  .blob,.pt{animation:none}
  .n,.unite,.depuis,.mnt,.sous{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

<div class="contenu">
  <span class="lg"><svg viewBox="0 0 5.0710 0.6860" aria-hidden="true"><g fill="currentColor"><path transform="translate(-0.05700 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H401L500 320H504L601 686H947V0H737V440H733L613 0H372L253 440H248V0Z"/><path transform="translate(0.86300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H572L552 526H263V426H541V273H263V160H552L572 0Z"/><path transform="translate(1.45000 0.68600) scale(0.001000 -0.001000)" d="M187 0V521H15V686H571V521H398V0Z"/><path transform="translate(1.90600 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/><path transform="translate(2.59300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H233L410 431L441 372L446 375V686H639V0H459L276 264L255 306L250 304V0Z"/><path transform="translate(3.23100 0.68600) scale(0.001000 -0.001000)" d="M331 -10Q269 -10 214.5 13.5Q160 37 119.0 78.0Q78 119 54.5 173.5Q31 228 31 290V394Q31 456 54.5 510.5Q78 565 119.0 606.0Q160 647 214.5 670.5Q269 694 331 694H387Q449 694 503.5 670.5Q558 647 599.0 606.0Q640 565 663.5 510.5Q687 456 687 394V290Q687 228 663.5 173.5Q640 119 599.0 78.0Q558 37 503.5 13.5Q449 -10 387 -10ZM359 146Q382 146 400.5 154.0Q419 162 433.0 175.5Q447 189 454.5 207.0Q462 225 462 246V438Q462 459 454.5 477.0Q447 495 433.0 509.0Q419 523 400.5 530.5Q382 538 359 538Q337 538 318.0 530.0Q299 522 285.0 508.5Q271 495 263.5 477.0Q256 459 256 438V246Q256 225 263.5 207.0Q271 189 285.0 175.0Q299 161 318.0 153.5Q337 146 359 146Z"/><path transform="translate(3.91200 0.68600) scale(0.001000 -0.001000)" d="M36 0V148H118V538H36V686H410V538H329V148H410V0Z"/><path transform="translate(4.35700 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/></g></svg></span>

  <div>
    <p class="n" id="km">—<u>km</u></p>
    <p class="unite">KILOMÈTRES</p>
    <p class="depuis">parcourus depuis le 28 août 2026</p>
  </div>

  <span class="trait"></span>

  <p class="mnt"><span class="pt"></span>Maintenance en cours</p>
  <p class="sous">Le site revient bientôt. Le compteur, lui, continue de tourner.</p>
</div>

<p class="pied">leprojetmetanoia.fr</p>

<script type="module">
import { list, fr, DEBUT } from './config.js?v=20260903c';
(async () => {
  try {
    const s = await list();
    const km = s.filter(x => x.date >= DEBUT).reduce((t, x) => t + Number(x.distance_km || 0), 0);
    document.getElementById('km').innerHTML = fr(km, 1) + '<u>km</u>';
  } catch (e) {
    document.getElementById('km').innerHTML = '—<u>km</u>';
  }
})();
</script>

['copy','cut','contextmenu','dragstart','selectstart'].forEach(ev =>

</script>
</body>
</html>
