:root{--vert:#0B7A3E;--vif:#12B85F;--ink:#0D0F0E;--sourd:#6B736E;--texte:#454B48;--piste:#E8EBE9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:var(--ink);font-family:Chivo,system-ui,sans-serif;
  max-width:430px;margin:0 auto;padding-bottom:48px;-webkit-font-smoothing:antialiased}
.entete{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--piste)}
.entete .lg{width:76px;color:var(--ink);line-height:0}
.entete .lg svg{display:block;width:100%;height:auto}
.ouvrir{margin-left:auto;background:none;border:0;cursor:pointer;display:grid;gap:4px;padding:10px;margin-right:-10px}
.ouvrir i{display:block;width:19px;height:2px;background:var(--ink);border-radius:2px}
.ouvrir:focus-visible{outline:2px solid var(--vert);outline-offset:2px;border-radius:6px}

.panneau{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top)) clamp(22px,6vw,40px) max(24px,env(safe-area-inset-bottom));
  opacity:0;visibility:hidden;transform:translateY(-10px);
  transition:opacity .3s ease,transform .35s cubic-bezier(.2,.9,.3,1),visibility .3s}
.panneau.ouvert{opacity:1;visibility:visible;transform:none}
.panneau .haut{display:flex;align-items:center;justify-content:space-between}
.panneau .lg{width:clamp(76px,22vw,104px);color:#fff;line-height:0}
.panneau .lg svg{display:block;width:100%;height:auto}
.fermer{background:none;border:0;color:#8B948F;font-size:22px;line-height:1;cursor:pointer;padding:10px;margin-right:-10px}
.panneau nav{margin:auto 0;display:grid}
.panneau nav a{display:flex;align-items:baseline;gap:14px;padding:clamp(13px,2.4vh,19px) 0;
  border-bottom:1px solid #1E2124;text-decoration:none}
.panneau nav a i{font-style:normal;font-weight:300;font-size:10px;letter-spacing:.14em;color:#5C6560}
.panneau nav a b{font-weight:900;font-size:clamp(24px,7vw,34px);letter-spacing:-.02em;color:#8E9793}
.panneau nav a.on b{color:var(--vif)}
.panneau .pied{font-weight:300;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#4E5754}
@media (prefers-reduced-motion:reduce){.panneau{transition:opacity .01ms}}

.z{padding:24px 20px 0}
.k{font-weight:300;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#A9B0AC}
.gros{font-weight:900;font-size:clamp(38px,11vw,46px);letter-spacing:-.045em;line-height:1;margin:8px 0 4px}
.gros u{text-decoration:none;font-size:.26em;color:var(--vert);margin-left:3px}

.mois{margin-top:30px}
.mois .titre{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:2px}
.mois .titre b{font-weight:900;font-size:15px;letter-spacing:-.01em}
.mois .titre em{font-style:normal;font-weight:300;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--sourd)}
.art{border-bottom:1px solid #F0F3F1;padding:15px 0}
.art .sur{font-weight:900;font-size:8px;letter-spacing:.24em;text-transform:uppercase}
.art h3{font-weight:900;font-size:22px;letter-spacing:-.035em;line-height:1.05;margin:5px 0 4px}
.art p{font-weight:300;font-size:11.5px;color:var(--texte);line-height:1.5}
.art .meta{display:flex;gap:14px;margin-top:7px;font-weight:300;font-size:10px;color:#A9B0AC;letter-spacing:.08em}
.art .meta b{font-weight:900;color:var(--ink)}
.vide{font-weight:300;font-size:12.5px;color:var(--texte);line-height:1.6;margin-top:16px}
.note{font-weight:300;font-size:10px;color:#A9B0AC;line-height:1.6;margin-top:26px;text-align:center}

<div class="z" id="z"><p class="k">Chargement…</p></div>

<script type="module">
import { list, projetActif } from './config.js';
import { vdot, nature, NATURES, COMMENTAIRES, fmtAllure } from './moteur.js';

const $ = id => document.getElementById(id);
const z = $('z');
const km = n => Number(n).toFixed(2).replace('.', ',');
const duree = s => { const h = Math.floor(s/3600), m = Math.floor(s/60)%60;
  return h ? `${h} h ${String(m).padStart(2,'0')}` : `${m} min`; };
const chrono = s => `${Math.floor(s/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

try {
  const [seances, p] = await Promise.all([list(), projetActif()]);
  const v = p ? vdot(p.ref_distance_m, p.ref_chrono_s) : 50;

  if (!seances.length) {
    z.innerHTML = `<p class="k">Séances</p>
      <p class="vide">Aucune séance enregistrée pour l'instant.
      Chaque entraînement apparaîtra ici, analysé par rapport aux zones d'allure du moment.</p>`;
  } else {
    const tri = seances.slice().sort((a,b) => b.date.localeCompare(a.date));
    const totKm = tri.reduce((a,s) => a + Number(s.distance_km || 0), 0);
    const salles = tri.filter(s => (s.type||'').toLowerCase().includes('salle')).length;

    // regroupement par mois
    const groupes = {};
    tri.forEach(s => { const c = s.date.slice(0,7); (groupes[c] = groupes[c] || []).push(s); });

    let html = `<p class="k">Séances</p>
      <div class="gros">${km(totKm)}<u>km</u></div>
      <p class="k">${tri.length} séance${tri.length>1?'s':''}${salles ? ' · ' + salles + ' en salle' : ''}</p>`;

    for (const [cle, lot] of Object.entries(groupes)) {
      const [an, mo] = cle.split('-');
      const kmMois = lot.reduce((a,s) => a + Number(s.distance_km || 0), 0);
      html += `<div class="mois"><div class="titre">
        <b>${MOIS[+mo-1].charAt(0).toUpperCase()+MOIS[+mo-1].slice(1)} ${an}</b>
        <em>${km(kmMois)} km · ${lot.length} séance${lot.length>1?'s':''}</em></div>`;

      lot.forEach((s, i) => {
        const veille = tri[tri.indexOf(s)+1] || null;
        const n = nature(s, v, veille);
        const N = NATURES[n];
        const salle = n === 'renfo';
        const t = Number(s.temps_s || 0), d = Number(s.distance_km || 0);
        const titre = salle ? (s.type || 'Renforcement') : km(d) + ' km';
        const jour = new Date(s.date + 'T00:00:00')
          .toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
        html += `<div class="art">
          <p class="sur" style="color:${N.couleur}">${N.nom}</p>
          <h3>${titre}</h3>
          <p>${COMMENTAIRES[n]}</p>
          <div class="meta"><span>${jour}</span>
            ${t ? `<span>${salle ? duree(t) : chrono(t)}</span>` : ''}
            ${(!salle && d && t) ? `<span><b>${fmtAllure(t/d)}</b>/km</span>` : ''}
            ${s.lieu ? `<span>${s.lieu}</span>` : ''}
          </div></div>`;
      });
      html += `</div>`;
    }

    html += `<p class="note">Chaque séance est classée par rapport aux allures calculées
      sur ton VDOT actuel (${v}). Une classification n'est pas un jugement :
      une séance de récupération est utile, une zone grise n'est pas une mauvaise sortie,
      juste une sortie mal placée dans la semaine.</p>`;
    z.innerHTML = html;
  }
} catch (e) {
  z.innerHTML = '<p class="k" style="color:#C4452F">Erreur : ' + e.message + '</p>';
}
</script>
<script>
(function(){
  var pan=document.getElementById('panneau'), ouv=document.getElementById('ouvrir'),
      fer=document.getElementById('fermer'), avant=null;
  function ouvrir(){ avant=document.activeElement; pan.classList.add('ouvert');
    ouv.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; fer.focus(); }
  function fermer(){ pan.classList.remove('ouvert'); ouv.setAttribute('aria-expanded','false');
    document.body.style.overflow=''; (avant||ouv).focus(); }
  ouv.addEventListener('click',ouvrir); fer.addEventListener('click',fermer);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&pan.classList.contains('ouvert')) fermer(); });
})();
</script>
