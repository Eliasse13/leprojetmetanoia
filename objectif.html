<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Metanoia — Objectif</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;700;900&display=swap" rel="stylesheet">
<style>
:root{--vert:#0B7A3E;--vif:#12B85F;--ink:#0D0F0E;--sourd:#6B736E;--texte:#454B48;--piste:#E3E6E4;--or:#C98A1E;--rouge:#C4452F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:var(--ink);font-family:Chivo,system-ui,sans-serif;max-width:430px;margin:0 auto;padding-bottom:110px;-webkit-font-smoothing:antialiased}
.bar{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--piste)}
.bar .lg{width:76px;color:var(--ink);line-height:0}
.bar .lg svg{display:block;width:100%;height:auto}
.bar i{margin-left:auto;display:grid;gap:4px}
.bar i b{display:block;width:19px;height:2px;background:var(--ink);border-radius:2px}
.z{padding:24px 20px 0}
.eyebrow{font-weight:300;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#A9B0AC}

.etoile{text-align:center;margin-bottom:28px}
.etoile .lbl{font-weight:900;font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin:9px 0 2px}
.etoile .chrono{font-weight:900;font-size:66px;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.etoile .u{font-weight:900;font-size:11px;letter-spacing:.32em;text-indent:.32em;margin-top:9px;
  background:linear-gradient(180deg,#12B85F,#0B7A3E);-webkit-background-clip:text;background-clip:text;color:transparent}
.etoile .quand{font-weight:300;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sourd);margin-top:10px}

.echelle{margin-bottom:26px}
.echelle .p{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F2F4F3;position:relative}
.echelle .p .pt{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--piste);background:#fff;flex:none;position:relative;z-index:2}
.echelle .p:not(:last-child) .pt::after{content:"";position:absolute;left:3.5px;top:13px;width:2px;height:26px;background:var(--piste)}
.echelle .p.fait .pt{border-color:var(--vif);background:var(--vif)}
.echelle .p.fait .pt::after{background:var(--vif)}
.echelle .p.suivant .pt{border-color:var(--ink);box-shadow:0 0 0 3px rgba(13,15,14,.08)}
.echelle .p .t{font-weight:900;font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.echelle .p.fait .t{color:var(--vert)}
.echelle .p.futur .t{color:#B7BEBA}
.echelle .p .v{font-weight:300;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#A9B0AC}
.echelle .p .st{margin-left:auto;font-weight:700;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#B7BEBA}
.echelle .p.fait .st{color:var(--vert)}
.echelle .p.suivant .st{color:var(--ink)}
.echelle .p.etoile2 .t{font-size:20px}

.trois{display:flex;border-top:1px solid var(--piste);border-bottom:1px solid var(--piste);margin-bottom:24px}
.trois div{flex:1;padding:14px 0;text-align:center;border-left:1px solid var(--piste)}
.trois div:first-child{border:0}
.trois b{display:block;font-weight:900;font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trois span{display:block;font-weight:300;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--sourd);margin-top:4px}
.trois .ok b{color:var(--vert)}

.charge .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.charge .h b{font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.charge .h em{font-style:normal;font-weight:900;font-size:12px;color:var(--vert)}
.charge .rail{height:8px;border-radius:5px;position:relative;background:linear-gradient(90deg,#DCE3DF 0 24%,#12B85F 24% 60%,#E8C46A 60% 80%,#D9705C 80% 100%)}
.charge .cur{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px}
.charge .bornes{display:flex;justify-content:space-between;margin-top:7px;font-weight:300;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#A9B0AC}
.charge p{font-weight:300;font-size:12px;color:var(--texte);line-height:1.6;margin:11px 0 24px}
.charge p b{font-weight:900;color:var(--ink)}

.allures .l{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F2F4F3}
.allures .l .pt{width:8px;height:8px;border-radius:2px;flex:none}
.allures .l b{font-weight:700;font-size:12.5px}
.allures .l span{font-weight:300;font-size:10px;color:#A9B0AC;letter-spacing:.06em}
.allures .l em{margin-left:auto;font-style:normal;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.note{font-weight:300;font-size:10px;color:#A9B0AC;line-height:1.6;text-align:center;margin-top:22px}


  /* records */
  .rec{display:grid;margin-bottom:26px}
  .rec .l{display:flex;align-items:baseline;gap:10px;padding:13px 0;border-bottom:1px solid #F2F4F3}
  .rec .l .d{font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A9B0AC;
    width:62px;flex:none}
  .rec .l .t{font-weight:900;font-size:25px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .rec .l .m{margin-left:auto;text-align:right}
  .rec .l .m b{display:block;font-weight:900;font-size:11px;color:var(--vert)}
  .rec .l .m span{font-weight:300;font-size:9.5px;color:#A9B0AC;letter-spacing:.06em}
  .rec .l.vide .t{color:#D3D9D6}
  .rec .l.vide .m b{color:#C6CCC9}
  /* palmarès */
  .pal{margin-bottom:26px}
  .pal .c{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #F2F4F3}
  .pal .c .med{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-weight:900;font-size:10px;background:#F1F4F2;color:#9AA29E}
  .pal .c .med.top{background:#FBF1D9;color:#8A6212}
  .pal .c .g b{display:block;font-weight:900;font-size:14px;letter-spacing:-.01em}
  .pal .c .g span{font-weight:300;font-size:10px;color:#A9B0AC;letter-spacing:.06em}
  .pal .c .d{margin-left:auto;text-align:right}
  .pal .c .d b{display:block;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
  .pal .c .d span{font-weight:300;font-size:9px;color:var(--vert);letter-spacing:.08em}
  .reco{border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:26px}
  .reco .t{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .reco .t b{font-weight:900;font-size:19px;letter-spacing:-.025em}
  .reco .t em{font-style:normal;margin-left:auto;font-weight:700;font-size:8.5px;letter-spacing:.18em;
    text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .reco .t em.dure{background:#F1EAFB;color:#6B3FC4}
  .reco .t em.souple{background:#E7F7EE;color:var(--vert)}
  .reco .t em.moyenne{background:#EAF2F8;color:#3B6E96}
  .reco .t em.repos{background:#F2F4F3;color:var(--sourd)}
  .reco .pq{font-weight:300;font-size:12px;color:var(--texte);line-height:1.55;margin-bottom:13px}
  .reco .bloc{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #F2F4F3}
  .reco .bloc:last-of-type{border:0}
  .reco .bloc .n{width:23px;height:23px;border-radius:50%;background:#F1F4F2;display:grid;place-items:center;
    font-weight:900;font-size:10px;color:var(--sourd);flex:none}
  .reco .bloc .d b{display:block;font-weight:900;font-size:13px}
  .reco .bloc .d span{font-weight:300;font-size:10.5px;color:var(--sourd)}
  .reco .bloc em{margin-left:auto;font-style:normal;font-weight:900;font-size:14px;color:var(--vert);
    font-variant-numeric:tabular-nums}
  .reco .tot{font-weight:300;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:#A9B0AC;margin-top:11px}

  /* ---- en-tête ---- */
  .hd{display:flex;align-items:center;gap:11px;padding:max(14px,env(safe-area-inset-top)) 20px 13px;
    border-bottom:1px solid var(--piste);position:relative;z-index:20}
  .hd .lg{width:74px;color:var(--ink);line-height:0;flex:none}
  .hd .lg svg{display:block;width:100%;height:auto}
  .sel{display:flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;padding:6px 4px;
    font-family:inherit;font-weight:900;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--vert)}
  .sel i{width:8px;height:8px;border-radius:50%;background:var(--vert);flex:none}
  .sel .fl{color:#B7BEBA;font-size:10px;transition:transform .2s}
  .sel[aria-expanded="true"] .fl{transform:rotate(180deg)}
  .sel:focus-visible{outline:2px solid var(--vert);outline-offset:2px;border-radius:6px}
  .cpt{margin-left:auto;width:31px;height:31px;border-radius:50%;border:1.4px dashed #CDD4D0;
    display:grid;place-items:center;color:#A9B0AC;flex:none;text-decoration:none}
  .cpt svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .piliers{position:absolute;left:16px;top:calc(100% - 4px);background:#fff;border:1px solid var(--piste);
    border-radius:12px;box-shadow:0 14px 34px -16px rgba(0,0,0,.32);padding:6px;min-width:212px;z-index:30;
    opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s}
  .piliers.ouvert{opacity:1;visibility:visible;transform:none}
  .piliers a,.piliers span{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;
    font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8C948F;text-decoration:none}
  .piliers .on{background:#EDF6F1;color:var(--vert)}
  .piliers i{width:8px;height:8px;border-radius:50%;background:#DDE3E0;flex:none}
  .piliers .on i{background:var(--vert)}
  .piliers .al i{background:#C9A227}
  .piliers em{font-style:normal;margin-left:auto;font-weight:300;font-size:8px;letter-spacing:.12em;color:#C0C7C3}

  /* ---- barre du bas ---- */
  .nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;
    border-top:1px solid var(--piste);padding:11px 0 max(15px,env(safe-area-inset-bottom));z-index:20}
  .nav a{flex:1;text-align:center;text-decoration:none}
  .nav a .num{display:block;font-weight:900;font-size:17px;letter-spacing:-.02em;color:#CDD4D0;line-height:1}
  .nav a b{display:block;font-weight:700;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#B7BEBA;margin-top:4px}
  .nav a.on .num{color:var(--vert)}
  .nav a.on b{color:var(--ink)}
  .nav a:focus-visible{outline:2px solid var(--vert);outline-offset:-3px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){.piliers{transition:none}}

  body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:pan-y;-webkit-tap-highlight-color:transparent}
  input,textarea,select{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
</style>
</head>

<header class="hd">
  <a class="lg" href="index.html" aria-label="Accueil Metanoia"><svg viewBox="0 0 5.0710 0.6860" aria-hidden="true"><g fill="currentColor"><path transform="translate(-0.05700 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H401L500 320H504L601 686H947V0H737V440H733L613 0H372L253 440H248V0Z"/><path transform="translate(0.86300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H572L552 526H263V426H541V273H263V160H552L572 0Z"/><path transform="translate(1.45000 0.68600) scale(0.001000 -0.001000)" d="M187 0V521H15V686H571V521H398V0Z"/><path transform="translate(1.90600 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/><path transform="translate(2.59300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H233L410 431L441 372L446 375V686H639V0H459L276 264L255 306L250 304V0Z"/><path transform="translate(3.23100 0.68600) scale(0.001000 -0.001000)" d="M331 -10Q269 -10 214.5 13.5Q160 37 119.0 78.0Q78 119 54.5 173.5Q31 228 31 290V394Q31 456 54.5 510.5Q78 565 119.0 606.0Q160 647 214.5 670.5Q269 694 331 694H387Q449 694 503.5 670.5Q558 647 599.0 606.0Q640 565 663.5 510.5Q687 456 687 394V290Q687 228 663.5 173.5Q640 119 599.0 78.0Q558 37 503.5 13.5Q449 -10 387 -10ZM359 146Q382 146 400.5 154.0Q419 162 433.0 175.5Q447 189 454.5 207.0Q462 225 462 246V438Q462 459 454.5 477.0Q447 495 433.0 509.0Q419 523 400.5 530.5Q382 538 359 538Q337 538 318.0 530.0Q299 522 285.0 508.5Q271 495 263.5 477.0Q256 459 256 438V246Q256 225 263.5 207.0Q271 189 285.0 175.0Q299 161 318.0 153.5Q337 146 359 146Z"/><path transform="translate(3.91200 0.68600) scale(0.001000 -0.001000)" d="M36 0V148H118V538H36V686H410V538H329V148H410V0Z"/><path transform="translate(4.35700 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/></g></svg></a>
  <button class="sel" id="selP" aria-expanded="false" aria-controls="piliers"><i></i>Sport<span class="fl">&#9662;</span></button>

    <span role="menuitem" aria-disabled="true"><i></i>Sommeil<em>bientôt</em></span>
    <span role="menuitem" aria-disabled="true"><i></i>Lecture<em>bientôt</em></span>

  </div>

<div class="z" id="z"><p class="eyebrow">Chargement…</p></div>

<script type="module">
import { list, projetActif, listPaliers, listResultats } from './config.js?v=20260831b';
import { vdot, tempsPour, allures, charge, recommandation, records, palmares,
         fmtChrono, fmtAllure } from './moteur.js?v=20260831b';

const $ = id => document.getElementById(id);
const z = $('z');

try {
  const p = await projetActif();
  if (!p) { z.innerHTML = '<p class="eyebrow">Aucun projet en cours</p>'; }
  else {
    const [pal, seances, res] = await Promise.all([listPaliers(p.id), list(), listResultats()]);
    const recs = records(res);
    const courses = palmares(res);
    const vAct = vdot(p.ref_distance_m, p.ref_chrono_s);
    const chronoAct = tempsPour(vAct, p.distance_m);
    const vCible = vdot(p.distance_m, p.chrono_cible_s);
    const ch = charge(seances);
    const r = recommandation(seances, vAct);
    const zones = allures(vAct);
    const TEINTES = ['#BFE8D0','#6FD79C','#12B85F','#0B7A3E','#075229'];

    const suivant = pal.find(x => !x.atteint_le && x.chrono_s < chronoAct) || pal.find(x => !x.atteint_le);
    const anneesRestantes = ((new Date(p.date_fin) - new Date()) / 3.15576e10).toFixed(1);
    const pos = ch.ratio == null ? 50 : Math.min(98, Math.max(2, (ch.ratio - 0.5) / 1.5 * 100));

    z.innerHTML = `
      <div class="etoile">
        <p class="eyebrow">Objectif du projet</p>
        <p class="lbl">5 000 mètres</p>
        <div class="chrono">${fmtChrono(p.chrono_cible_s)}</div>
        <p class="u">L'ÉTOILE POLAIRE</p>
        <p class="quand">avant le 18 août 2036 — ${anneesRestantes} ans</p>
      </div>

      <div class="trois">
        <div><b>${fmtChrono(chronoAct)}</b><span>niveau actuel</span></div>
        <div class="ok"><b>${vAct}</b><span>VDOT actuel</span></div>
        <div><b>${(vCible - vAct).toFixed(1)}</b><span>points à gagner</span></div>
      </div>

      <p class="eyebrow" style="margin-bottom:6px">Records personnels</p>
      <div class="rec">
        ${recs.map(r => r.vide
          ? `<div class="l vide"><span class="d">${r.nom}</span><span class="t">—</span>
             <span class="m"><b>à courir</b><span>jamais tenté</span></span></div>`
          : `<div class="l"><span class="d">${r.nom}</span><span class="t">${fmtChrono(r.temps)}</span>
             <span class="m"><b>VDOT ${r.vdot}</b><span>${new Date(r.date+'T00:00:00')
               .toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}${
               r.denivele ? ' · ' + r.denivele + ' m D+' : ''}</span></span></div>`
        ).join('')}
      </div>

      <p class="eyebrow" style="margin-bottom:10px">Les paliers</p>
      <div class="echelle">
        ${pal.map((x, i) => {
          const fait = !!x.atteint_le || x.chrono_s >= chronoAct;
          const est = suivant && x.id === suivant.id;
          const cl = fait ? 'fait' : (est ? 'suivant' : 'futur');
          const v = vdot(p.distance_m, x.chrono_s);
          return `<div class="p ${cl} ${i === pal.length-1 ? 'etoile2' : ''}">
            <span class="pt"></span>
            <div><div class="t">${fmtChrono(x.chrono_s)}</div>
              <div class="v">VDOT ${v}${i === pal.length-1 ? ' — étoile' : ''}</div></div>
            <span class="st">${fait ? 'franchi' : est ? 'palier suivant' : ''}</span>
          </div>`;
        }).join('')}
      </div>

      ${courses.length ? `<p class="eyebrow" style="margin-bottom:6px">Palmarès — ${courses.length} course${courses.length>1?'s':''}</p>
      <div class="pal">
        ${courses.map(c => `<div class="c">
          <span class="med ${c.record ? 'top' : ''}">${c.record ? '★' : (c.classement || '—')}</span>
          <div class="g"><b>${c.nom}</b><span>${new Date(c.date+'T00:00:00')
            .toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})} · ${c.distanceNom}</span></div>
          <span class="d"><b>${fmtChrono(c.temps_s)}</b><span${c.douteux ? ' style="color:#C4452F"' : ''}>${
            c.douteux ? 'chrono à vérifier'
              : (c.classement && c.participants ? c.classement + 'ᵉ / ' + c.participants : '')
          }${c.record ? ' — record' : ''}</span></span></div>`).join('')}
      </div>` : ''}

      <p class="eyebrow" style="margin-bottom:9px">La séance d\'aujourd\'hui</p>
      <div class="reco">
        <div class="t"><b>${r.titre}</b><em class="${r.intensite}">${
          r.intensite === 'dure' ? 'séance dure' : r.intensite === 'repos' ? 'repos'
          : r.intensite === 'moyenne' ? 'volume' : 'facile'}</em></div>
        <p class="pq">${r.pourquoi}</p>
        ${r.blocs.map((b,i) => `<div class="bloc"><span class="n">${i+1}</span>
          <div class="d"><b>${b.nom}</b><span>${b.detail}</span></div>
          <em>${fmtAllure(b.secondesParKm)}</em></div>`).join('')}
        ${r.km ? `<p class="tot">environ ${r.km} km</p>` : ''}
      </div>

      <div class="charge">
        <div class="h"><b>Charge d'entraînement</b><em>${ch.ratio ?? '—'}</em></div>
        ${ch.ratio === null ? '' : `<div class="rail"><span class="cur" style="left:${pos}%"></span></div>
        <div class="bornes"><span>sous-entraîné</span><span>optimal</span><span>risqué</span></div>`}
        <p>${ch.etat === 'insuffisant'
          ? `Pas encore mesurable. Il faut au moins <b>5 séances</b> sur <b>3 semaines</b> —
             la base en contient ${ch.seances} sur ${ch.jours} jour${ch.jours>1?'s':''}.`
          : `${ch.km7} km sur 7 jours, ${ch.km28} km sur 28.
             ${ch.etat === 'optimal' ? 'Tu progresses sans forcer.'
             : ch.etat === 'sous-entraine' ? 'Tu es en dessous de ton volume habituel.'
             : ch.etat === 'eleve' ? 'Tu montes vite. Surveille les signaux.'
             : 'Charge risquée. Au-delà de <b>1,5</b>, le risque de blessure double.'}`}</p>
      </div>

      <div class="allures">
        <p class="eyebrow" style="margin-bottom:8px">Tes allures, calculées sur VDOT ${vAct}</p>
        ${zones.map((zz,i) => `<div class="l"><span class="pt" style="background:${TEINTES[i]}"></span>
          <b>${zz.nom}</b><span>${zz.sous}</span><em>${fmtAllure(zz.secondesParKm)}</em></div>`).join('')}
      </div>

      <p class="note">Référence : ${fmtChrono(p.ref_chrono_s)} sur ${p.ref_distance_m/1000} km${p.ref_note ? ' — ' + p.ref_note : ''}.
        Charge calculée sur ${seances.length} séance${seances.length>1?'s':''}.
        Aucune date n'est projetée sur les paliers : à dix ans, ce serait inventé.</p>`;
  }
} catch (e) {
  z.innerHTML = '<p class="eyebrow" style="color:#C4452F">Erreur : ' + e.message + '</p>';
}
</script>

<script>
(function(){
  var b=document.getElementById('selP'), m=document.getElementById('piliers');
  function ferme(){ m.classList.remove('ouvert'); b.setAttribute('aria-expanded','false'); }
  b.addEventListener('click', function(e){
    e.stopPropagation();
    var o = m.classList.toggle('ouvert');
    b.setAttribute('aria-expanded', o ? 'true' : 'false');
  });
  document.addEventListener('click', ferme);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') ferme(); });
})();
</script>

<script>
// pas de sélection ni de copie ; zoom bloqué sur mobile seulement
['copy','cut','contextmenu','dragstart','selectstart'].forEach(function(ev){
  document.addEventListener(ev, function(e){
    if (e.target.closest('input, textarea, select')) return;   // la saisie reste possible
    e.preventDefault();
  });
});
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
});
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();
}, { passive:false });
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && ['c','x','a','u','s','p'].indexOf(e.key.toLowerCase()) > -1) {
    if (e.target.closest('input, textarea')) return;
    e.preventDefault();
  }
});
</script>
