<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Metanoia — Saisie</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;700;900&display=swap" rel="stylesheet">
<style>
:root{--vert:#0B7A3E;--vif:#12B85F;--ink:#0D0F0E;--piste:#E8EBE9;--sourd:#6B736E;--texte:#454B48;--rouge:#C4452F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:var(--ink);font-family:Chivo,system-ui,sans-serif;
  max-width:430px;margin:0 auto;padding-bottom:110px;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;
  -webkit-tap-highlight-color:transparent}
input,textarea,select{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
a{color:inherit;text-decoration:none}

.hd{display:flex;align-items:center;gap:11px;padding:max(14px,env(safe-area-inset-top)) 20px 13px;
  border-bottom:1px solid var(--piste)}
.hd .lg{width:74px;color:var(--ink);line-height:0;flex:none}
.hd .lg svg{display:block;width:100%;height:auto}
.hd .t{font-weight:900;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--vert)}
.hd .q{margin-left:auto;font-weight:300;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#A9B0AC}

.z{padding:24px 20px 0}
.k{font-weight:300;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#A9B0AC}
h2{font-weight:900;font-size:19px;letter-spacing:-.025em;margin:0 0 3px}
.sous{font-weight:300;font-size:11.5px;color:var(--texte);line-height:1.5;margin-bottom:16px}
section{margin-bottom:38px}

.form{display:grid;gap:13px}
.f{display:grid;gap:5px}
.f.duo{grid-template-columns:1fr 1fr;gap:10px}
.f.duo>div{display:grid;gap:5px}
label{font-weight:900;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sourd)}
.hint{font-weight:300;font-size:10px;color:#B7BEBA}
input,select{width:100%;border:1.5px solid var(--piste);border-radius:9px;padding:12px 13px;
  font-family:inherit;font-weight:700;font-size:15px;color:var(--ink);background:#fff;
  -webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#A9B0AC 50%),linear-gradient(135deg,#A9B0AC 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus{outline:0;border-color:var(--ink)}
input[type=range]{padding:0;border:0;accent-color:var(--vert);height:38px}
.rv{font-weight:900;font-size:14px;color:var(--ink)}

.allure{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--piste);padding-top:12px;margin-top:2px}
.allure .l{font-weight:300;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sourd)}
.allure .v{font-weight:900;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.allure .v small{font-size:.45em;color:var(--sourd);font-weight:300;letter-spacing:.1em}

.btn{width:100%;background:var(--vert);color:#fff;border:0;border-radius:999px;padding:14px;
  font-family:inherit;font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn:disabled{background:#DDE3DF;color:#9AA19D}
.btn.ghost{background:#fff;color:var(--sourd);border:1.5px solid var(--piste);display:none}
.form.edit .btn.ghost{display:block}
.msg{font-weight:700;font-size:11.5px;min-height:1.3em;color:var(--vert);text-align:center}

.log{width:100%;border-collapse:collapse}
.log th{font-weight:300;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#B7BEBA;
  text-align:left;padding:0 8px 8px 0;border-bottom:1.5px solid var(--ink)}
.log td{padding:12px 8px 12px 0;border-bottom:1px solid #F2F4F3;vertical-align:top;
  font-variant-numeric:tabular-nums;font-weight:300;font-size:12px;color:var(--texte)}
.log tbody tr{cursor:pointer}
.log tbody tr:hover{background:#FAFBFA}
.log tr.editing{background:#F1F7F3}
.log td.d{font-weight:300;font-size:10.5px;color:#A9B0AC;white-space:nowrap}
.log td.k{font-weight:900;font-size:12.5px;color:var(--ink);white-space:nowrap}
.log td .n{color:#B7BEBA;font-size:10.5px;display:block;margin-top:2px}
.log .tag{font-weight:900;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--vert)}
.log .empty td{text-align:center;color:#B7BEBA;padding:34px 0;font-size:12px}
.log td:last-child,.log th:last-child{text-align:right;padding-right:0}
.log .del{background:none;border:0;color:#DDE3DF;cursor:pointer;font-size:16px;font-family:inherit;padding:0 2px}
.log tr:hover .del{color:#A9B0AC}
.log .del:hover{color:var(--rouge)!important}
@media(max-width:420px){.hide{display:none}}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--piste);
  padding:11px 0 max(15px,env(safe-area-inset-bottom));z-index:20;max-width:430px;margin:0 auto}
.nav a{flex:1;text-align:center}
.nav a .num{display:block;font-weight:900;font-size:16px;letter-spacing:-.02em;color:#CDD4D0;line-height:1}
.nav a b{display:block;font-weight:700;font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  color:#B7BEBA;margin-top:4px}
.nav a.on .num{color:var(--vert)}
.nav a.on b{color:var(--ink)}
</style>
</head>
<body>

<header class="hd">
  <a class="lg" href="index.html" aria-label="Accueil"><svg viewBox="0 0 5.0710 0.6860" aria-hidden="true"><g fill="currentColor"><path transform="translate(-0.05700 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H401L500 320H504L601 686H947V0H737V440H733L613 0H372L253 440H248V0Z"/><path transform="translate(0.86300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H572L552 526H263V426H541V273H263V160H552L572 0Z"/><path transform="translate(1.45000 0.68600) scale(0.001000 -0.001000)" d="M187 0V521H15V686H571V521H398V0Z"/><path transform="translate(1.90600 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/><path transform="translate(2.59300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H233L410 431L441 372L446 375V686H639V0H459L276 264L255 306L250 304V0Z"/><path transform="translate(3.23100 0.68600) scale(0.001000 -0.001000)" d="M331 -10Q269 -10 214.5 13.5Q160 37 119.0 78.0Q78 119 54.5 173.5Q31 228 31 290V394Q31 456 54.5 510.5Q78 565 119.0 606.0Q160 647 214.5 670.5Q269 694 331 694H387Q449 694 503.5 670.5Q558 647 599.0 606.0Q640 565 663.5 510.5Q687 456 687 394V290Q687 228 663.5 173.5Q640 119 599.0 78.0Q558 37 503.5 13.5Q449 -10 387 -10ZM359 146Q382 146 400.5 154.0Q419 162 433.0 175.5Q447 189 454.5 207.0Q462 225 462 246V438Q462 459 454.5 477.0Q447 495 433.0 509.0Q419 523 400.5 530.5Q382 538 359 538Q337 538 318.0 530.0Q299 522 285.0 508.5Q271 495 263.5 477.0Q256 459 256 438V246Q256 225 263.5 207.0Q271 189 285.0 175.0Q299 161 318.0 153.5Q337 146 359 146Z"/><path transform="translate(3.91200 0.68600) scale(0.001000 -0.001000)" d="M36 0V148H118V538H36V686H410V538H329V148H410V0Z"/><path transform="translate(4.35700 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/></g></svg></a>
  <span class="t">Saisie</span>
  <button class="q" id="quitter" style="background:none;border:0;font-family:inherit;cursor:pointer">Déconnexion</button>
</header>

<div class="z">

  <section>
    <h2>Nouvel entraînement</h2>
    <p class="sous" id="formTitle" style="display:none"></p>
    <div class="form" id="form">
      <div class="f duo">
        <div><label for="date">Date</label><input id="date" type="date"></div>
        <div><label for="type">Type</label><select id="type"></select></div>
      </div>
      <div class="f"><label for="lieu">Lieu</label>
        <input id="lieu" type="text" placeholder="Corniche, piste, Calanques…"></div>
      <div class="f duo">
        <div><label for="dist">Distance</label><input id="dist" type="text" inputmode="decimal" placeholder="7,37">
          <span class="hint">km — 7,37 = 7 km 370 m</span></div>
        <div><label for="temps">Temps</label><input id="temps" type="text" placeholder="52:30">
          <span class="hint">h:mm:ss ou mm:ss</span></div>
      </div>
      <div class="f duo">
        <div><label for="den">Dénivelé +</label><input id="den" type="number" min="0" placeholder="120">
          <span class="hint">mètres</span></div>
        <div><label for="ress">Ressenti <span class="rv" id="ressV">7</span>/10</label>
          <input id="ress" type="range" min="1" max="10" value="7"></div>
      </div>
      <div class="f"><label for="notes">Notes</label>
        <input id="notes" type="text" placeholder="Jambes lourdes, vent de face…"></div>
      <div class="allure"><span class="l">Allure moyenne</span>
        <span class="v" id="paceLive">—<small>/km</small></span></div>
      <button class="btn" id="save">Enregistrer</button>
      <button class="btn ghost" id="cancel">Annuler</button>
      <p class="msg" id="msg"></p>

  </section>

  <section>
    <h2>Entraînements <span class="k" id="count"></span></h2>
    <table class="log">
      <thead><tr><th>Date</th><th>Séance</th><th>Dist.</th><th>Temps</th>
        <th class="hide">D+</th><th>Allure</th><th class="hide">Res.</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section>
    <h2>Résultats de course</h2>
    <p class="sous" id="recordInfo"></p>
    <div class="form" id="rForm">
      <div class="f"><label for="rNom">Nom de la course</label>
        <input id="rNom" type="text" placeholder="Foulée des félibres"></div>
      <div class="f duo">
        <div><label for="rDate">Date</label><input id="rDate" type="date"></div>
        <div><label for="rDist">Distance</label><input id="rDist" type="text" inputmode="decimal" placeholder="5">
          <span class="hint">km</span></div>
      </div>
      <div class="f duo">
        <div><label for="rTemps">Temps</label><input id="rTemps" type="text" placeholder="17:13">
          <span class="hint">h:mm:ss ou mm:ss</span></div>
        <div><label for="rDen">Dénivelé +</label><input id="rDen" type="number" min="0" placeholder="500">
          <span class="hint">mètres</span></div>
      </div>
      <div class="f duo">
        <div><label for="rClas">Classement</label><input id="rClas" type="number" min="1" placeholder="9"></div>
        <div><label for="rPart">Participants</label><input id="rPart" type="number" min="1" placeholder="234"></div>
      </div>
      <button class="btn" id="rSave">Ajouter</button>
      <p class="msg" id="rMsg"></p>
    </div>
    <table class="log" style="margin-top:18px">
      <thead><tr><th>Date</th><th>Course</th><th>Dist.</th><th>Temps</th><th class="hide">Class.</th><th></th></tr></thead>
      <tbody id="rRows"></tbody>
    </table>
  </section>

  <section>
    <h2>Prochaine compétition</h2>
    <p class="sous" id="compInfo"></p>
    <div class="form" id="compForm">
      <div class="f"><label for="cNom">Nom</label><input id="cNom" type="text" placeholder="Marathon de Marseille"></div>
      <div class="f duo">
        <div><label for="cLieu">Lieu</label><input id="cLieu" type="text" placeholder="Marseille"></div>
        <div><label for="cDate">Date</label><input id="cDate" type="date"></div>
      </div>
      <button class="btn" id="cSave">Enregistrer</button>
      <button class="btn ghost" id="cDelete" style="display:none">Supprimer</button>
      <p class="msg" id="cMsg"></p>
    </div>
  </section>

</div>

<script type="module">
import { exigerConnexion, deconnexion, list, insert, update, remove, TYPES, parseTime, parseKm, fmtTime, fmtPace, fr, listCompetitions, insertCompetition, updateCompetition, removeCompetition, listResultats, insertResultat, removeResultat } from './config.js?v=20260831f';
import { plausible, fmtAllure } from './moteur.js?v=20260831f';

if (!await exigerConnexion()) throw new Error('non connecté');
const $ = id => document.getElementById(id);
const short = d => new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
let rows = [], editing = null;

$('type').innerHTML = TYPES.map(t => `<option>${t}</option>`).join('');
$('date').value = new Date().toISOString().slice(0,10);
$('ress').addEventListener('input', () => $('ressV').textContent = $('ress').value);
const livePace = () => { $('paceLive').innerHTML = fmtPace(parseTime($('temps').value), parseKm($('dist').value)) + '<small>/km</small>'; };
$('temps').addEventListener('input', livePace); $('dist').addEventListener('input', livePace);

function fill(r){ $('date').value=r.date; $('type').value=r.type||TYPES[0]; $('lieu').value=r.lieu||''; $('dist').value=r.distance_km; $('temps').value=fmtTime(r.temps_s);
  $('den').value=r.denivele_m||''; $('notes').value=r.notes||''; $('ress').value=r.ressenti||7; $('ressV').textContent=$('ress').value; livePace(); }
function reset(){ editing=null; ['lieu','dist','temps','den','notes'].forEach(i=>$(i).value=''); $('ress').value=7; $('ressV').textContent=7; $('date').value=new Date().toISOString().slice(0,10);
  $('form').classList.remove('edit'); $('formTitle').textContent='Nouvel entraînement'; $('save').textContent='Enregistrer'; livePace(); render(); }
function startEdit(r){ editing=r.id; fill(r); $('form').classList.add('edit'); $('formTitle').textContent='Modifier — '+short(r.date); $('save').textContent='Mettre à jour'; render(); $('form').scrollIntoView({behavior:'smooth'}); }

function render(){
  $('count').textContent = rows.length ? `${rows.length} sorties · ${fr(rows.reduce((a,r)=>a+Number(r.distance_km),0))} km` : '';
  $('rows').innerHTML = rows.length ? rows.map(r => `<tr data-id="${r.id}" class="${r.id===editing?'editing':''}">
    <td class="d">${short(r.date)}</td>
    <td><span class="tag">${r.type||''}</span>${r.lieu?'<br>'+r.lieu:''}${r.notes?`<div class="n">${r.notes}</div>`:''}</td>
    <td class="k">${fr(r.distance_km)} km</td><td class="k">${fmtTime(r.temps_s)}</td>
    <td class="k hide">${r.denivele_m?fr(r.denivele_m,0)+' m':'—'}</td><td class="k">${fmtPace(r.temps_s,r.distance_km)}</td>
    <td class="k hide">${r.ressenti?r.ressenti+'/10':'—'}</td>
    <td><button class="del" data-del="${r.id}" title="Supprimer">×</button></td></tr>`).join('')
    : `<tr class="empty"><td colspan="8">Aucun entraînement. Le premier kilomètre commence ici.</td></tr>`;
}
async function refresh(){ try { rows = await list(); render(); } catch(e){ $('msg').textContent='Erreur : '+e.message; } }


// refuse une performance physiquement impossible
function verifieAllure(km, sec, cible, dplus) {
  if (!plausible(km * 1000, sec)) {
    const a = sec / km;
    document.getElementById(cible).textContent =
      'Allure de ' + fmtAllure(a) + '/km — c\u2019est impossible. Vérifie le temps : '
      + 'pour une heure et plus, écris 1:49:00 et non 1:49.';
    return false;
  }
  return true;
}

$('save').addEventListener('click', async () => {
  const d=parseKm($('dist').value), s=parseTime($('temps').value);
  if(!$('date').value||!d||!s){ $('msg').textContent='Date, distance et temps sont obligatoires.'; return; }
  if(!verifieAllure(d, s, 'msg', Number($('den').value)||0)) return;
  const row={ date:$('date').value, type:$('type').value, lieu:$('lieu').value.trim(), distance_km:d, temps_s:s, denivele_m:Number($('den').value)||0, notes:$('notes').value.trim(), ressenti:Number($('ress').value) };
  $('save').disabled=true;
  try { if(editing!==null){ await update(editing,row); $('msg').textContent='Mis à jour.'; } else { await insert(row); $('msg').textContent=`Enregistré — ${fr(d)} km de plus.`; }
    await refresh(); reset(); } catch(e){ $('msg').textContent='Erreur : '+e.message; }
  $('save').disabled=false;
});
$('cancel').addEventListener('click', reset);
$('rows').addEventListener('click', async e => {
  const del=e.target.closest('[data-del]');
  if(del){ e.stopPropagation(); if(confirm('Supprimer cet entraînement ?')){ try{ await remove(isNaN(del.dataset.del)?del.dataset.del:Number(del.dataset.del)); if(editing==del.dataset.del) reset(); await refresh(); }catch(err){ $('msg').textContent='Erreur : '+err.message; } } return; }
  const tr=e.target.closest('tr[data-id]'); if(!tr) return;
  const r=rows.find(x=>String(x.id)===tr.dataset.id); if(r) startEdit(r);
});
refresh();

let currentCompId = null;
async function refreshComp() {
  try {
    const compList = await listCompetitions();
    const today = new Date().toISOString().slice(0,10);
    const next = compList.find(c => c.date >= today) || compList[0] || null;
    if (next) {
      currentCompId = next.id;
      $('cNom').value = next.nom; $('cLieu').value = next.lieu || ''; $('cDate').value = next.date;
      $('compInfo').textContent = `— ${short(next.date)}`;
      $('cDelete').style.display = 'inline-block';
    } else {
      currentCompId = null; $('cNom').value=''; $('cLieu').value=''; $('cDate').value='';
      $('compInfo').textContent = ''; $('cDelete').style.display = 'none';
    }
  } catch (e) { $('cMsg').textContent = 'Erreur : ' + e.message; }
}
$('cSave').addEventListener('click', async () => {
  const nom = $('cNom').value.trim(), date = $('cDate').value;
  if (!nom || !date) { $('cMsg').textContent = 'Nom et date sont obligatoires.'; return; }
  const row = { nom, lieu: $('cLieu').value.trim(), date };
  $('cSave').disabled = true;
  try {
    if (currentCompId !== null) await updateCompetition(currentCompId, row); else await insertCompetition(row);
    $('cMsg').textContent = 'Enregistré.'; await refreshComp();
  } catch (e) { $('cMsg').textContent = 'Erreur : ' + e.message; }
  $('cSave').disabled = false;
});
$('cDelete').addEventListener('click', async () => {
  if (currentCompId === null || !confirm('Supprimer cette compétition ?')) return;
});
refreshComp();

async function refreshResultats() {
  try {
    const rows = await listResultats();
    // record = meilleur temps par distance
    const records = {};
    rows.forEach(r => { const key = fr(r.distance_km); if (!records[key] || r.temps_s < records[key]) records[key] = r.temps_s; });
    $('recordInfo').textContent = Object.keys(records).length
      ? '— ' + Object.entries(records).map(([d,s]) => `${d} km : ${fmtTime(s)}`).join(' · ') : '';
    $('rRows').innerHTML = rows.length ? rows.map(r => `<tr data-id="${r.id}">
      <td class="d">${short(r.date)}</td><td>${r.nom}</td><td class="k">${fr(r.distance_km)} km</td><td class="k">${fmtTime(r.temps_s)}</td>
      <td class="k">${r.classement ? r.classement + (r.participants ? ' / ' + r.participants : '') : '—'}</td>
      <td><button class="del" data-rdel="${r.id}" title="Supprimer">×</button></td></tr>`).join('')
      : `<tr class="empty"><td colspan="6">Aucun résultat pour l'instant.</td></tr>`;
  } catch (e) { $('rMsg').textContent = 'Erreur : ' + e.message; }
}
$('rSave').addEventListener('click', async () => {
  const nom = $('rNom').value.trim(), date = $('rDate').value, d = parseKm($('rDist').value), s = parseTime($('rTemps').value);
  if (!nom || !date || !d || !s) { $('rMsg').textContent = 'Nom, date, distance et temps sont obligatoires.'; return; }
  if (!verifieAllure(d, s, 'rMsg', Number($('rDen').value)||0)) return;
  $('rSave').disabled = true;
  try {
    await insertResultat({ nom, date, distance_km: d, temps_s: s, denivele_m: Number($('rDen').value) || 0, classement: Number($('rClas').value) || null, participants: Number($('rPart').value) || null });
    ['rNom','rDist','rTemps','rDen','rClas','rPart'].forEach(i => $(i).value = ''); $('rDate').value = '';
    $('rMsg').textContent = 'Résultat ajouté.'; await refreshResultats();
  } catch (e) { $('rMsg').textContent = 'Erreur : ' + e.message; }
  $('rSave').disabled = false;
});
$('rRows').addEventListener('click', async e => {
  const b = e.target.closest('[data-rdel]'); if (!b) return;
  if (confirm('Supprimer ce résultat ?')) { try { await removeResultat(Number(b.dataset.rdel)); await refreshResultats(); } catch (err) { $('rMsg').textContent = 'Erreur : ' + err.message; } }
});
refreshResultats();
</script>
<script type="module">
import { deconnexion } from './config.js?v=20260831f';
import { plausible, fmtAllure } from './moteur.js?v=20260831f';
document.getElementById('quitter').addEventListener('click', async () => {
  await deconnexion(); location.href = 'index.html';
});
</script>

<script>
// pas de sélection ni de copie ; zoom bloqué sur mobile seulement
['copy','cut','contextmenu','dragstart','selectstart'].forEach(function(ev){
  document.addEventListener(ev, function(e){
    if (e.target.closest('input, textarea, select')) return;   // la saisie reste possible
    e.preventDefault();
  });
});
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
});
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();
}, { passive:false });
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && ['c','x','a','u','s','p'].indexOf(e.key.toLowerCase()) > -1) {
    if (e.target.closest('input, textarea')) return;
    e.preventDefault();
  }
});
</script>
