<title>Metanoia — Sport</title>
<meta name="description" content="Pilier sport du projet Metanoia : kilomètres parcourus, régularité et prochaine échéance.">

<style>
  :root{--ink:#0D0F0E;
    --fond:#FFFFFF;
    --vert:#0B7A3E;
    --craie:#0D0F0E;
    --sourd:#6B736E;
    --texte:#454B48;
    --piste:#E3E6E4;
    --vif:#12B85F;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--fond);color:var(--craie);
    font-family:"Chivo",system-ui,sans-serif;
    min-height:100svh;
    display:flex;flex-direction:column;
    text-align:center;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:pan-y;
    -webkit-tap-highlight-color:transparent;
  }
  .contenu{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(20px,4vh,38px);
    padding:clamp(24px,5vh,44px) clamp(20px,5vw,52px) 24px;
  }

  /* compteur principal — le chiffre se remplit */
  .compteur{display:grid;gap:clamp(8px,1.8vh,14px);justify-items:center}
  .liquide{width:min(88vw,440px);height:auto;display:block}
  .liquide .creux{fill:#C7CEC9}
  .vague{animation:houle 5.5s ease-in-out infinite alternate}
  @keyframes houle{from{transform:translateX(0)}to{transform:translateX(-120px)}}
  .unite{
    font-weight:900;font-size:clamp(13px,3.6vw,17px);
    letter-spacing:.34em;text-indent:.34em;
    background:linear-gradient(180deg,#12B85F,#0B7A3E);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .depuis{font-weight:300;font-size:clamp(11px,2.9vw,13px);letter-spacing:.24em;text-transform:uppercase;color:var(--sourd)}
  .palier{font-weight:300;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sourd)}
  .palier b{font-weight:700;color:var(--vert)}
  @media (prefers-reduced-motion:reduce){.vague{animation:none}}

  .err{position:fixed;top:14px;left:0;right:0;font-size:12px;color:#B3261E}

  .r{opacity:0;transform:translateY(12px);animation:in 1.1s var(--ease) forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.r{animation:none;opacity:1;transform:none}}
  @media (max-height:620px){body{gap:14px}}


  /* ---- en-tête ---- */
  .hd{display:flex;align-items:center;gap:11px;padding:max(14px,env(safe-area-inset-top)) 20px 13px;
    border-bottom:1px solid var(--piste);position:relative;z-index:20}
  .hd .lg{width:74px;color:var(--ink);line-height:0;flex:none}
  .hd .lg svg{display:block;width:100%;height:auto}
  .sel:focus-visible{outline:2px solid var(--vert);outline-offset:2px;border-radius:6px}


  /* ---- barre du bas ---- */


  /* bouton menu */
  .menu{margin-left:auto;background:none;border:0;cursor:pointer;display:grid;gap:4px;padding:9px;margin-right:-9px}
  .menu i{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s,opacity .3s}
  .menu:focus-visible{outline:2px solid var(--vert);outline-offset:2px;border-radius:6px}

  /* pied de page : les visites */
  .visites{padding:14px 0 max(16px,env(safe-area-inset-bottom));text-align:center;
    font-weight:300;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#B7BEBA}

  /* panneau de navigation — aurore verte */
  .aurore{position:fixed;inset:0;z-index:60;background:#05100A;color:#EDF2EF;overflow:hidden;
    display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom));
    opacity:0;visibility:hidden;transition:opacity .32s ease,visibility .32s}
  .aurore.ouvert{opacity:1;visibility:visible}
  .aurore .blob{position:absolute;border-radius:50%;filter:blur(48px);opacity:.55;pointer-events:none}
  .aurore .b1{width:60vw;height:60vw;max-width:300px;max-height:300px;background:#12B85F;left:-16vw;top:-8vh;
    animation:fl1 9s ease-in-out infinite alternate}
  .aurore .b2{width:54vw;height:54vw;max-width:270px;max-height:270px;background:#0B7A3E;right:-16vw;top:30vh;
    animation:fl2 11s ease-in-out infinite alternate}
  .aurore .b3{width:46vw;height:46vw;max-width:230px;max-height:230px;background:#31E07A;left:12vw;bottom:-12vh;
    opacity:.32;animation:fl1 13s ease-in-out infinite alternate-reverse}
  @keyframes fl1{to{transform:translate(9vw,7vh) scale(1.15)}}
  @keyframes fl2{to{transform:translate(-10vw,-6vh) scale(1.1)}}

  .aurore .haut{display:flex;align-items:center;position:relative;z-index:5}
  .aurore .haut .lg{width:clamp(70px,20vw,96px);color:#EDF2EF;line-height:0}
  .aurore .haut .lg svg{display:block;width:100%;height:auto}
  .aurore .fermer{margin-left:auto;background:none;border:0;color:#8B948F;font-size:20px;
    line-height:1;cursor:pointer;padding:9px;margin-right:-9px}
  .aurore .fermer:focus-visible{outline:2px solid var(--vif);outline-offset:2px;border-radius:6px}

  .aurore nav{margin:auto 0;position:relative;z-index:5;display:grid}
  .aurore nav a{display:flex;align-items:flex-end;gap:12px;padding:clamp(11px,2vh,15px) 0;
    border-bottom:1px solid rgba(255,255,255,.09);text-decoration:none;
    opacity:0;transform:translateY(10px)}
  .aurore.ouvert nav a{animation:entree .5s cubic-bezier(.2,.9,.3,1) forwards}
  .aurore nav a:nth-child(1){animation-delay:.06s} .aurore nav a:nth-child(2){animation-delay:.11s}
  .aurore nav a:nth-child(3){animation-delay:.16s} .aurore nav a:nth-child(4){animation-delay:.21s}
  .aurore nav a:nth-child(5){animation-delay:.26s} .aurore nav a:nth-child(6){animation-delay:.31s}
  @keyframes entree{to{opacity:1;transform:none}}
  .aurore nav a i{font-style:normal;font-weight:300;font-size:9.5px;letter-spacing:.16em;
    color:#5C6560;padding-bottom:4px}
  .aurore nav a b{font-weight:900;font-size:clamp(21px,6.2vw,27px);letter-spacing:-.03em;color:#8E9793;
    transition:color .18s,transform .18s}
  .aurore nav a:active b{transform:translateX(4px)}
  .aurore nav a.on b{color:#31E07A}
  .aurore nav a.on i{color:#31E07A}
  .aurore .vis{position:relative;z-index:5;font-weight:300;font-size:8.5px;letter-spacing:.22em;
    text-transform:uppercase;text-align:center;color:#4E5754}

  @media (prefers-reduced-motion:reduce){
    .aurore{transition:opacity .01ms}
    .aurore .blob{animation:none}
    .aurore.ouvert nav a{animation:none;opacity:1;transform:none}
  }
</style>
</head>

<div class="contenu">

</div>

<div class="err" id="err"></div>

<script type="module">
import { list, DEBUT, fr, enregistrerVisite, nbVisites } from './config.js?v=20260902m';
const $ = id => document.getElementById(id);

try {
  const all  = await list();
  const rows = all.filter(r => r.date >= DEBUT);
  const km   = rows.reduce((a, r) => a + Number(r.distance_km), 0);

  // palier suivant + niveau de remplissage
  const PALIERS = [50, 100, 250, 500, 1000, 2000, 5000, 10000, 21000];
  const palier = PALIERS.find(p => km < p) || Math.ceil(km / 5000) * 5000;
  const precedent = PALIERS[PALIERS.indexOf(palier) - 1] || 0;
  const ratio = Math.max(0.04, Math.min(1, (km - precedent) / (palier - precedent)));

  const HAUT = 8, BAS = 92;                        // hauteur utile des chiffres
  const niveau = BAS - ratio * (BAS - HAUT);
  const texte = fr(km);
  const uid = 'c' + Date.now();

  $('compteur').innerHTML = `
    <svg class="liquide" viewBox="0 0 600 108" role="img" aria-label="${texte} kilomètres parcourus">
      <defs>
        <clipPath id="${uid}">
          <text x="300" y="92" text-anchor="middle" font-family="Chivo, sans-serif"
                font-weight="900" font-size="104" letter-spacing="-4">${texte}</text>
        </clipPath>
        <linearGradient id="g-${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#12B85F"/><stop offset="100%" stop-color="#0B7A3E"/>
        </linearGradient>
      </defs>
      <g clip-path="url(#${uid})">
        <rect class="creux" x="0" y="0" width="600" height="108"/>
        <g class="niveau" style="transform:translateY(120px)">
          <g class="vague">
            <path fill="url(#g-${uid})"
                  d="M-140 0 q 60 -13 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 V 200 H -140 Z"/>
          </g>
        </g>
      </g>
    </svg>
    <p class="unite">KILOMÈTRES</p>
    <p class="depuis">parcourus depuis le 28 août 2026</p>
    <p class="palier">prochain palier <b>${fr(palier,0)} km</b></p>`;

  // montée du liquide
  const couche = $('compteur').querySelector('.niveau');
  requestAnimationFrame(() => {
    couche.style.transition = 'transform 2.2s cubic-bezier(.25,.9,.3,1)';
    couche.style.transform = `translateY(${niveau.toFixed(1)}px)`;
  });

} catch (e) { $('err').textContent = 'Erreur : ' + e.message; }

enregistrerVisite();

// compteur de visites
(async () => {
  try {
    const n = await nbVisites();
    if (n === null) return;
    const t = `${fr(n, 0)} visite${n > 1 ? 's' : ''}`;
    document.getElementById('visits').textContent = t;
    document.getElementById('visMenu').textContent = t;
  } catch (e) {}
})();



// pas de sélection ni de copie ; zoom bloqué sur mobile seulement
['copy','cut','contextmenu','dragstart','selectstart'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); });
});
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
});
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();
}, { passive:false });
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && ['c','x','a','u','s','p'].indexOf(e.key.toLowerCase()) > -1) {
    e.preventDefault();
  }
});
</script>

<script>
(function(){
  var p = document.getElementById('aurore'),
      o = document.getElementById('ouvrirMenu'),
      f = document.getElementById('fermerMenu'), avant = null;
  function ouvrir(){
    avant = document.activeElement;
    p.classList.add('ouvert'); o.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden'; f.focus();
  }
  function fermer(){
    p.classList.remove('ouvert'); o.setAttribute('aria-expanded','false');
    document.body.style.overflow = ''; (avant || o).focus();
  }
  o.addEventListener('click', ouvrir);
  f.addEventListener('click', fermer);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fermer(); });
})();
</script>
