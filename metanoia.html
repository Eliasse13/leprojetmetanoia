<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Metanoia — Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--mid:#5c5c5c;--soft:#9a9a9a;--gold:#9a7b3c;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:#fff;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;display:grid;place-items:center;text-align:center;padding:6vh 6vw;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.phrase{font-style:italic;font-weight:300;font-size:clamp(1.3rem,3.4vw,2.1rem);max-width:22ch;line-height:1.55;margin-top:5vh}
.phrase b{font-style:normal;font-weight:500;color:var(--ink)}
.err{position:fixed;bottom:16px;left:0;right:0;font-size:.9rem;color:#b00}
.visits{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--soft);opacity:0;animation:in 1.4s var(--ease) 1.6s forwards}
.r{opacity:0;transform:translateY(14px);animation:in 1.4s var(--ease) forwards}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.r{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div>
  <span class="label r" style="animation-delay:.1s">Metanoia · Sport</span>
  <p class="phrase r" id="phrase" style="animation-delay:.4s"></p>
</div>
<div class="err" id="err"></div>
<div class="visits" id="visits"></div>

<script type="module">
import { list, DEBUT, fr, enregistrerVisite, nbVisites } from './config.js';
const $ = id => document.getElementById(id);

try {
  const rows = (await list()).filter(r => r.date >= DEBUT);
  const km = rows.reduce((a,r) => a + Number(r.distance_km), 0);
  $('phrase').innerHTML = km > 0
    ? `<b>${fr(km)} kilomètres</b> parcourus depuis le 1<sup>er</sup> septembre 2026.`
    : `Rien encore. <b>Le premier kilomètre</b> reste à parcourir.`;
} catch (e) { $('err').textContent = 'Erreur : ' + e.message; }

enregistrerVisite().then(async () => {
  try { const n = await nbVisites(); if (n !== null) $('visits').textContent = `${fr(n,0)}e visiteur du chemin`; }
  catch (e) { /* silencieux */ }
});

['wheel','touchmove','gesturestart','gesturechange'].forEach(ev => addEventListener(ev, e => e.preventDefault(), { passive:false }));
</script>
</body>
</html>
