<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Metanoia — Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--mid:#5c5c5c;--soft:#9a9a9a;--line:#dcdcdc;--gold:#9a7b3c;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:#fff;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;display:grid;place-items:center;text-align:center;padding:6vh 6vw;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.km{font-family:'Cinzel',serif;font-size:clamp(4.5rem,16vw,12rem);line-height:1;letter-spacing:.03em;margin-top:4vh;font-variant-numeric:tabular-nums}
.km small{font-size:.26em;color:var(--mid);letter-spacing:.2em;margin-left:.25em}
.since{margin-top:2.5vh;color:var(--mid);font-size:clamp(1rem,1.8vw,1.25rem)}
.sep{width:1px;height:8vh;margin:5vh auto;background:linear-gradient(transparent,var(--line),transparent)}
.last .label{color:var(--mid)}
.last .t{font-family:'Cinzel',serif;font-size:clamp(1.3rem,3.2vw,2.2rem);letter-spacing:.08em;margin-top:2vh;line-height:1.3}
.last .t em{font-style:normal;color:var(--gold)}
.last .m{margin-top:1.4vh;color:var(--mid);font-size:clamp(1rem,1.7vw,1.2rem)}
.last .m i{font-style:italic}
.empty{color:var(--soft);font-style:italic;margin-top:2vh}
.err{position:fixed;bottom:16px;left:0;right:0;font-size:.9rem;color:#b00}
.r{opacity:0;transform:translateY(14px);animation:in 1.4s var(--ease) forwards}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.r{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div>
  <span class="label r" style="animation-delay:.1s">Metanoia · Sport</span>
  <div class="km r" style="animation-delay:.3s"><span id="total">0</span><small>km</small></div>
  <p class="since r" style="animation-delay:.6s">parcourus depuis le 1<sup>er</sup> septembre 2026</p>
  <div class="sep r" style="animation-delay:.9s"></div>
  <div class="last r" style="animation-delay:1.1s">
    <span class="label">Dernière sortie</span>
    <div id="last"><p class="empty">Aucune sortie enregistrée pour l'instant.</p></div>
  </div>
</div>
<div class="err" id="err"></div>

<script type="module">
import { list, DEBUT, fmtTime, fmtDate, fr } from './config.js';
const $ = id => document.getElementById(id);
function count(el, to){ const t0 = performance.now(), dur = 2400;
  (function f(t){ const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,4); el.textContent = fr(to*e, to%1 ? 1 : 0); if (p<1) requestAnimationFrame(f); })(t0); }
try {
  const rows = (await list()).filter(r => r.date >= DEBUT);
  const km = rows.reduce((a,r) => a + Number(r.distance_km), 0);
  setTimeout(() => count($('total'), km), 300);
  if (rows.length) { const l = rows[0];
    $('last').innerHTML = `<div class="t">${fr(l.distance_km)} km <em>·</em> ${fmtTime(l.temps_s)}</div>
      <div class="m">${l.type || ''}${l.lieu ? ' — ' + l.lieu : ''}<br><i>${fmtDate(l.date)}</i></div>`; }
} catch (e) { $('err').textContent = 'Erreur : ' + e.message; }
['wheel','touchmove','gesturestart','gesturechange'].forEach(ev => addEventListener(ev, e => e.preventDefault(), { passive:false }));
</script>
</body>
</html>
