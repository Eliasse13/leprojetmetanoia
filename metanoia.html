<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Metanoia — Sport</title>
<meta name="description" content="Pilier sport du projet Metanoia : kilomètres parcourus, régularité et prochaine échéance.">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFFFFF'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%230B7A3E' stroke-width='9' stroke-linecap='round' stroke-dasharray='142 189' transform='rotate(-90 50 50)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fond:#FFFFFF;
    --vert:#0B7A3E;
    --craie:#0D0F0E;
    --sourd:#6B736E;
    --texte:#454B48;
    --piste:#E3E6E4;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--fond);color:var(--craie);
    font-family:"Chivo",system-ui,sans-serif;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(20px,4vh,38px);
    padding:max(24px,env(safe-area-inset-top)) clamp(20px,5vw,52px) max(24px,env(safe-area-inset-bottom));
    text-align:center;
    -webkit-font-smoothing:antialiased;
  }


  /* compteur principal — le chiffre se remplit */
  .compteur{display:grid;gap:clamp(8px,1.8vh,14px);justify-items:center}
  .liquide{width:min(88vw,440px);height:auto;display:block}
  .liquide .creux{fill:#C7CEC9}
  .vague{animation:houle 5.5s ease-in-out infinite alternate}
  @keyframes houle{from{transform:translateX(0)}to{transform:translateX(-120px)}}
  .unite{font-weight:900;font-size:clamp(13px,3.6vw,17px);letter-spacing:.34em;text-indent:.34em;color:var(--vert)}
  .depuis{font-weight:300;font-size:clamp(11px,2.9vw,13px);letter-spacing:.24em;text-transform:uppercase;color:var(--sourd)}
  .palier{font-weight:300;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sourd)}
  .palier b{font-weight:700;color:var(--vert)}
  @media (prefers-reduced-motion:reduce){.vague{animation:none}}

  /* régularité : 14 jours */
  .reg{display:grid;gap:10px;justify-items:center}
  .jours{display:flex;gap:clamp(4px,1.4vw,7px)}
  .jours i{width:clamp(7px,2.2vw,10px);aspect-ratio:1;border-radius:50%;background:var(--piste)}
  .jours i.on{background:var(--vert)}
  .reg span{font-weight:300;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sourd)}

  /* prochaine échéance */
  .comp{display:grid;gap:6px;border-top:1px solid var(--piste);padding-top:clamp(16px,3vh,26px);min-width:min(86vw,340px)}
  .comp .n{font-weight:900;font-size:clamp(30px,9vw,58px);line-height:1;letter-spacing:-.03em;color:var(--vert)}
  .comp .n small{font-weight:300;font-size:.3em;letter-spacing:.2em;text-transform:uppercase;color:var(--sourd);margin-left:.35em}
  .comp .l{font-weight:300;font-size:clamp(12px,3.2vw,14px);color:var(--texte);line-height:1.5}

  .date{font-weight:300;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sourd)}
  .date em{font-style:normal;color:var(--vert)}
  .visites{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;
    font-weight:300;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#9AA19D}
  .err{position:fixed;top:14px;left:0;right:0;font-size:12px;color:#B3261E}

  .r{opacity:0;transform:translateY(12px);animation:in 1.1s var(--ease) forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.r{animation:none;opacity:1;transform:none}}
  @media (max-height:620px){body{gap:14px}}
</style>
</head>
<body>


<div class="compteur r" id="compteur" style="animation-delay:.2s"></div>

<div class="reg r" id="reg" style="animation-delay:.45s"></div>

<div class="comp r" id="comp" style="animation-delay:.7s" hidden></div>

<p class="date r" id="date" style="animation-delay:.9s"></p>

<div class="visites" id="visits"></div>
<div class="err" id="err"></div>

<script type="module">
import { list, DEBUT, fr, enregistrerVisite, nbVisites, prochaineCompetition } from './config.js';
const $ = id => document.getElementById(id);
const START = new Date('2026-08-18T00:00:00');

try {
  const all  = await list();
  const rows = all.filter(r => r.date >= DEBUT);
  const km   = rows.reduce((a, r) => a + Number(r.distance_km), 0);

  // palier suivant + niveau de remplissage
  const PALIERS = [50, 100, 250, 500, 1000, 2000, 5000, 10000, 21000];
  const palier = PALIERS.find(p => km < p) || Math.ceil(km / 5000) * 5000;
  const precedent = PALIERS[PALIERS.indexOf(palier) - 1] || 0;
  const ratio = Math.max(0.04, Math.min(1, (km - precedent) / (palier - precedent)));

  const HAUT = 8, BAS = 92;                        // hauteur utile des chiffres
  const niveau = BAS - ratio * (BAS - HAUT);
  const texte = fr(km);
  const uid = 'c' + Date.now();

  $('compteur').innerHTML = `
    <svg class="liquide" viewBox="0 0 600 108" role="img" aria-label="${texte} kilomètres parcourus">
      <defs>
        <clipPath id="${uid}">
          <text x="300" y="92" text-anchor="middle" font-family="Chivo, sans-serif"
                font-weight="900" font-size="104" letter-spacing="-4">${texte}</text>
        </clipPath>
        <linearGradient id="g-${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#12B85F"/><stop offset="100%" stop-color="#0B7A3E"/>
        </linearGradient>
      </defs>
      <g clip-path="url(#${uid})">
        <rect class="creux" x="0" y="0" width="600" height="108"/>
        <g class="niveau" style="transform:translateY(120px)">
          <g class="vague">
            <path fill="url(#g-${uid})"
                  d="M-140 0 q 60 -13 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 V 200 H -140 Z"/>
          </g>
        </g>
      </g>
    </svg>
    <p class="unite">KILOMÈTRES</p>
    <p class="depuis">parcourus depuis le 28 août 2026</p>
    <p class="palier">prochain palier <b>${fr(palier,0)} km</b></p>`;

  // montée du liquide
  const couche = $('compteur').querySelector('.niveau');
  requestAnimationFrame(() => {
    couche.style.transition = 'transform 2.2s cubic-bezier(.25,.9,.3,1)';
    couche.style.transform = `translateY(${niveau.toFixed(1)}px)`;
  });

  const now  = new Date();
  const jours = Math.max(1, Math.floor((now - START) / 864e5) + 1);
  const dateStr = now.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  $('date').innerHTML = `${dateStr} <em>—</em> jour ${jours}`;

  // régularité : un point par jour sur les 14 derniers
  const actifs = new Set(all.map(r => r.date));
  let pts = '', n = 0;
  for (let i = 13; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    const on = actifs.has(iso); if (on) n++;
    pts += `<i class="${on ? 'on' : ''}"></i>`;
  }
  $('reg').innerHTML = `<div class="jours" aria-label="${n} jours actifs sur les 14 derniers">${pts}</div>`
    + `<span>${n} jour${n > 1 ? 's' : ''} actif${n > 1 ? 's' : ''} sur 14</span>`;

  const comp = await prochaineCompetition();
  if (comp) {
    const j = Math.max(0, Math.ceil((new Date(comp.date + 'T00:00') - now) / 864e5));
    $('comp').hidden = false;
    $('comp').innerHTML = `<div class="n">${j}<small>${j > 1 ? 'jours' : 'jour'}</small></div>`
      + `<p class="l">avant ${comp.nom}${comp.lieu ? ' — ' + comp.lieu : ''}</p>`;
  }
} catch (e) { $('err').textContent = 'Erreur : ' + e.message; }

enregistrerVisite().then(async () => {
  try { const n = await nbVisites(); if (n !== null) $('visits').textContent = `${fr(n,0)} visites`; }
  catch (e) {}
});
</script>
</body>
</html>
