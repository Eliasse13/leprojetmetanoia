<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metanoia — Connexion</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;700;900&display=swap" rel="stylesheet">
<style>
:root{--fond:#000;--vif:#31E07A;--craie:#EDF2EF;--sourd:#767F7A;--rouge:#E0553F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--craie);font-family:Chivo,system-ui,sans-serif;
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:24px;text-align:center}
.lg{width:min(70vw,220px);color:var(--craie);line-height:0;margin-bottom:8px}
.lg svg{display:block;width:100%;height:auto}
p.k{font-weight:300;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--sourd)}
form{width:min(90vw,320px);display:grid;gap:10px;margin-top:10px}
input{width:100%;background:#0C0F0D;border:1.5px solid #1C221F;border-radius:9px;padding:13px 14px;
  font-family:inherit;font-weight:700;font-size:15px;color:var(--craie)}
input:focus{outline:0;border-color:var(--vif)}
input::placeholder{color:#4A524E;font-weight:300}
button{background:var(--vif);color:#07130C;border:0;border-radius:999px;padding:14px;
  font-family:inherit;font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
button[disabled]{opacity:.5}
.lien{background:none;color:var(--sourd);border:0;font-family:inherit;font-weight:300;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:6px}
.lien:hover{color:var(--craie)}
.msg{font-weight:700;font-size:12px;min-height:1.4em}
.msg.ko{color:var(--rouge)} .msg.ok{color:var(--vif)}
</style>
</head>
<body>
<a class="lg" href="index.html" aria-label="Accueil"><svg viewBox="0 0 5.0710 0.6860" aria-hidden="true"><g fill="currentColor"><path transform="translate(-0.05700 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H401L500 320H504L601 686H947V0H737V440H733L613 0H372L253 440H248V0Z"/><path transform="translate(0.86300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H572L552 526H263V426H541V273H263V160H552L572 0Z"/><path transform="translate(1.45000 0.68600) scale(0.001000 -0.001000)" d="M187 0V521H15V686H571V521H398V0Z"/><path transform="translate(1.90600 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/><path transform="translate(2.59300 0.68600) scale(0.001000 -0.001000)" d="M57 0V686H233L410 431L441 372L446 375V686H639V0H459L276 264L255 306L250 304V0Z"/><path transform="translate(3.23100 0.68600) scale(0.001000 -0.001000)" d="M331 -10Q269 -10 214.5 13.5Q160 37 119.0 78.0Q78 119 54.5 173.5Q31 228 31 290V394Q31 456 54.5 510.5Q78 565 119.0 606.0Q160 647 214.5 670.5Q269 694 331 694H387Q449 694 503.5 670.5Q558 647 599.0 606.0Q640 565 663.5 510.5Q687 456 687 394V290Q687 228 663.5 173.5Q640 119 599.0 78.0Q558 37 503.5 13.5Q449 -10 387 -10ZM359 146Q382 146 400.5 154.0Q419 162 433.0 175.5Q447 189 454.5 207.0Q462 225 462 246V438Q462 459 454.5 477.0Q447 495 433.0 509.0Q419 523 400.5 530.5Q382 538 359 538Q337 538 318.0 530.0Q299 522 285.0 508.5Q271 495 263.5 477.0Q256 459 256 438V246Q256 225 263.5 207.0Q271 189 285.0 175.0Q299 161 318.0 153.5Q337 146 359 146Z"/><path transform="translate(3.91200 0.68600) scale(0.001000 -0.001000)" d="M36 0V148H118V538H36V686H410V538H329V148H410V0Z"/><path transform="translate(4.35700 0.68600) scale(0.001000 -0.001000)" d="M-5 0 224 686H485L714 0H496L455 122H237L197 0ZM285 267H407L349 475H344Z"/></g></svg></a>
<p class="k" id="titre">Espace privé</p>
<form id="f">
  <input id="mail" type="email" placeholder="Adresse e-mail" autocomplete="email" required>
  <input id="mdp"  type="password" placeholder="Mot de passe" autocomplete="current-password" required minlength="8">
  <button id="ok" type="submit">Se connecter</button>
</form>
<p class="msg" id="msg"></p>
<button class="lien" id="bascule">Créer le compte</button>

<script type="module">
import { connexion, inscription, utilisateur } from './config.js';
const $ = id => document.getElementById(id);
const suite = new URLSearchParams(location.search).get('suite') || 'admin.html';
let mode = 'connexion';

if (await utilisateur()) location.href = suite;

$('bascule').addEventListener('click', () => {
  mode = mode === 'connexion' ? 'inscription' : 'connexion';
  $('titre').textContent = mode === 'connexion' ? 'Espace privé' : 'Créer le compte';
  $('ok').textContent = mode === 'connexion' ? 'Se connecter' : 'Créer le compte';
  $('bascule').textContent = mode === 'connexion' ? 'Créer le compte' : 'J\u2019ai déjà un compte';
  $('mdp').autocomplete = mode === 'connexion' ? 'current-password' : 'new-password';
  $('msg').textContent = '';
});

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const m = $('msg'); m.className = 'msg'; m.textContent = '';
  $('ok').disabled = true;
  try {
    if (mode === 'connexion') { await connexion($('mail').value.trim(), $('mdp').value); location.href = suite; }
    else {
      await inscription($('mail').value.trim(), $('mdp').value);
      m.className = 'msg ok';
      m.textContent = 'Compte créé. Vérifie ta boîte mail si une confirmation est demandée.';
      $('ok').disabled = false;
    }
  } catch (err) {
    m.className = 'msg ko';
    m.textContent = err.message === 'Invalid login credentials' ? 'E-mail ou mot de passe incorrect.' : err.message;
    $('ok').disabled = false;
  }
});
</script>
</body>
</html>
